<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시장 수급 체크</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<style>
:root{
  --bg:#0e1117; --card:#171c26; --card2:#1d2433; --line:#2a3245;
  --tx:#e8ecf4; --tx2:#9aa5b8; --up:#f04452; --dn:#3485fa; --flat:#8b95a8;
  --acc:#f5b942; --ind:#f5b942; --frg:#4fd1c5; --inst:#b794f4;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'Pretendard','Segoe UI','Malgun Gothic',sans-serif;padding:14px;font-feature-settings:'tnum';max-width:1280px;margin:0 auto}
a{color:inherit}
h1{font-size:21px;margin-bottom:2px}
h2{font-size:15px;margin:0 0 10px;color:var(--acc);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2 .sub{font-size:11px;color:var(--tx2);font-weight:400}
.updated{color:var(--tx2);font-size:12px;margin-bottom:12px;line-height:1.6}
.badge{display:inline-block;font-size:10px;padding:1px 7px;border-radius:9px;border:1px solid var(--line);color:var(--tx2);margin-left:4px;vertical-align:1px}
.badge.kw{border-color:#2f6f4f;color:#7ee2a8}
.grid{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.full{grid-column:1/-1}
.row{display:flex;gap:10px;flex-wrap:wrap}
.kpi{background:var(--card2);border-radius:10px;padding:10px 14px;flex:1;min-width:130px}
.kpi .l{font-size:11px;color:var(--tx2)}
.kpi .v{font-size:18px;font-weight:700;margin-top:2px}
.kpi .d{font-size:11px;margin-top:2px;color:var(--tx2)}
.up{color:var(--up)}.dn{color:var(--dn)}.flat{color:var(--flat)}
.verdict{font-size:16px;font-weight:700;margin:2px 0 10px}
.verdict .why{display:block;font-size:12px;font-weight:400;color:var(--tx2);margin-top:3px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:4px 12px;border-radius:14px;border:1px solid var(--line);background:none;color:var(--tx2);cursor:pointer;font-size:12px;font-family:inherit}
.tab.on{background:var(--acc);color:#10131a;border-color:var(--acc);font-weight:700}
.bar-row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}
.bar-row .nm{width:92px;flex:none;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .track{flex:1;position:relative;height:14px;min-width:0}
.bar-row .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line)}
.bar-row .b{position:absolute;top:0;height:14px;border-radius:3px}
.bar-row .val{width:74px;flex:none;color:var(--tx2);font-size:11px;white-space:nowrap}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:5px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--tx2);font-weight:400}
td:first-child,th:first-child{text-align:left}
td a{text-decoration:none;border-bottom:1px dotted var(--tx2)}
.note{font-size:11px;color:var(--tx2);margin-top:8px;line-height:1.6}
.empty{font-size:12px;color:var(--tx2);background:var(--card2);border-radius:8px;padding:12px;line-height:1.6}
.err{background:#3a1d22;border:1px solid #6b2a35;border-radius:8px;padding:10px;font-size:12px;margin-bottom:12px;display:none;line-height:1.6}
.legend{display:flex;gap:12px;font-size:11px;color:var(--tx2);flex-wrap:wrap;margin-top:6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctl .lab{font-size:12px;color:var(--tx2);font-weight:700}
.chart{position:relative;height:260px}
</style>
</head>
<body>
<h1>🧭 시장 수급 체크</h1>
<div class="updated" id="updated">불러오는 중…</div>
<div class="err" id="err"></div>

<div class="grid">

<div class="card full ctl">
  <span class="lab">시장</span>
  <span class="tabs" id="mkTabs">
    <button class="tab on" data-mk="kospi">코스피</button>
    <button class="tab" data-mk="kosdaq">코스닥</button>
  </span>
  <span class="lab" style="margin-left:8px">기간</span>
  <span class="tabs" id="pTabs">
    <button class="tab" data-p="5">5일</button>
    <button class="tab" data-p="20">20일</button>
    <button class="tab on" data-p="60">60일</button>
  </span>
</div>

<!-- ① 오늘 -->
<div class="card full">
  <h2>① 오늘 수급 <span class="sub" id="todayDate"></span></h2>
  <div class="verdict" id="verdict"></div>
  <div class="row" id="kpis"></div>
  <div class="note">순매수 단위: 억원. 판정은 외국인·기관 순매수 방향(오늘)과 최근 5일 합계로만 정한다 — 매매 추천이 아니다.</div>
</div>

<!-- ② 누적 -->
<div class="card full">
  <h2>② 투자주체별 누적 순매수 <span class="sub">기간 시작일 = 0, 오른쪽 축 = 지수</span></h2>
  <div class="chart"><canvas id="cumChart"></canvas></div>
  <div class="legend"><span><i class="dot" style="background:var(--ind)"></i>개인</span><span><i class="dot" style="background:var(--frg)"></i>외국인</span><span><i class="dot" style="background:var(--inst)"></i>기관</span><span><i class="dot" style="background:#e8ecf4"></i>지수</span></div>
</div>

<!-- ③ 기관 세부 -->
<div class="card">
  <h2>③ 기관 세부 <span class="sub" id="instSub"></span></h2>
  <div id="instBox"></div>
</div>

<!-- ④ 프로그램 -->
<div class="card">
  <h2>④ 프로그램 매매 <span class="sub">차익·비차익 일별 순매수</span></h2>
  <div id="progBox"></div>
</div>

<!-- ④-1 선물 -->
<div class="card full">
  <h2>④-1 코스피200 선물 투자자 <span class="sub">누적 순매수 · 네이버 표기 값(단위 확인 중)</span></h2>
  <div id="futBox"></div>
</div>

<!-- ⑤ 장중 -->
<div class="card full">
  <h2>⑤ 장중 흐름 <span class="sub" id="intraSub"></span></h2>
  <div id="intraBox"></div>
</div>

<!-- ⑥ 업종 -->
<div class="card">
  <h2>⑥ 업종별 외국인·기관 순매수 <span class="sub">오늘</span></h2>
  <div id="secBox"></div>
</div>

<!-- ⑦ 종목 -->
<div class="card">
  <h2>⑦ 종목 순위 <span class="sub">종목 클릭 → 타이밍 앱</span></h2>
  <div class="tabs" id="rkTabs" style="margin-bottom:8px"></div>
  <div class="scroll" id="rkBox"></div>
</div>

<!-- ⑧ 보조 -->
<div class="card full">
  <h2>⑧ 공매도·대차·신용</h2>
  <div id="auxBox"></div>
</div>

</div>

<div class="note" id="srcNote" style="margin-top:14px"></div>

<script>
const $=id=>document.getElementById(id);
let M=null,S=null,MK='kospi',P=60,RK=null;
const charts={};
const NAMES={ind:'개인',frg:'외국인',inst:'기관계',fininv:'금융투자',ins:'보험',trust:'투신',bank:'은행',etcfin:'기타금융',pension:'연기금',pef:'사모',nation:'국가',etccorp:'기타법인'};
const INST_KEYS=['fininv','trust','pension','pef','ins','bank','etcfin','nation','etccorp'];
const SRC={kiwoom:'키움',naver:'네이버',daum:'다음',money:'수급흐름 앱'};

const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const cls=v=>v>0?'up':v<0?'dn':'flat';
const sum=a=>a.reduce((s,v)=>s+(v||0),0);
function eok(v){
  if(v==null||isNaN(v))return '–';
  const a=Math.abs(v),s=v>0?'+':v<0?'−':'';
  return a>=10000?s+(a/10000).toFixed(2)+'조':s+Math.round(a).toLocaleString()+'억';
}
function badge(src){return src?`<span class="badge ${src==='kiwoom'?'kw':''}">${SRC[src]||src}</span>`:''}
function empty(msg){return `<div class="empty">${msg}</div>`}
const WAIT='키움 API 연결 후 표시된다. 공개 원천에는 이 항목이 없다.';

async function getJSON(u){
  try{const r=await fetch(u+(u.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});return r.ok?await r.json():null}
  catch(e){return null}
}

/* 투자자 시계열 — supply/data.json(세부) 우선, 없으면 money/data.json(3주체) */
function investor(mk){
  const si=S&&S.investor&&S.investor[mk];
  if(si&&S.dates&&si.frg&&si.frg.some(v=>v!=null))
    return {dates:S.dates,src:(S.src||{}).investor||'kiwoom',...si};
  const mi=M&&M.investor&&M.investor[mk];
  if(!mi)return null;
  return {dates:M.dates,src:'money',ind:mi.individual,frg:mi.foreign,inst:mi.institution};
}
function closes(mk,dates){
  const m=M&&M.market&&M.market[mk];
  if(!m)return dates.map(()=>null);
  const map={};M.dates.forEach((d,i)=>map[d]=m.close[i]);
  return dates.map(d=>map[d]??null);
}
function lastIdx(arr){for(let i=arr.length-1;i>=0;i--)if(arr[i]!=null)return i;return -1}

function renderToday(){
  const iv=investor(MK);
  if(!iv){$('verdict').textContent='투자자 데이터 없음';$('kpis').innerHTML='';return}
  const i=lastIdx(iv.frg);
  $('todayDate').innerHTML=(iv.dates[i]||'')+badge(iv.src);
  const f=iv.frg[i],n=iv.inst[i],p=iv.ind[i];
  const f5=sum(iv.frg.slice(i-4,i+1)),n5=sum(iv.inst.slice(i-4,i+1));
  let v,c;
  if(f>0&&n>0){v='수급 우호 — 외국인·기관 동반 순매수';c='up'}
  else if(f<0&&n<0){v='수급 약세 — 외국인·기관 동반 순매도';c='dn'}
  else if(f>0){v='외국인 주도 — 외국인 매수, 기관 매도';c='flat'}
  else {v='기관 주도 — 기관 매수, 외국인 매도';c='flat'}
  const t5=f5+n5;
  const why=`최근 5일 외국인+기관 ${eok(t5)} → ${t5>0?'매수 우위 흐름':'매도 우위 흐름'}`;
  $('verdict').innerHTML=`<span class="${c}">${v}</span><span class="why">${why}</span>`;
  const k=[['개인',p,sum(iv.ind.slice(i-4,i+1)),sum(iv.ind.slice(i-19,i+1))],
           ['외국인',f,f5,sum(iv.frg.slice(i-19,i+1))],
           ['기관',n,n5,sum(iv.inst.slice(i-19,i+1))]];
  const pg=S&&S.program&&S.program[MK];
  if(pg&&pg.total){const j=lastIdx(pg.total);if(j>=0)k.push(['프로그램',pg.total[j],sum(pg.total.slice(j-4,j+1)),sum(pg.total.slice(j-19,j+1))])}
  const fu=S&&S.futures;
  if(fu&&fu.frg){const j=lastIdx(fu.frg);if(j>=0)k.push(['외국인 선물',fu.frg[j],sum(fu.frg.slice(j-4,j+1)),null,fu.unit??''])}
  $('kpis').innerHTML=k.map(([l,v,a5,a20,u])=>{
    const fm=u!==undefined?x=>x==null?'–':(x>0?'+':'')+Math.round(x).toLocaleString()+u:eok;
    return `<div class="kpi"><div class="l">${l}</div><div class="v ${cls(v)}">${fm(v)}</div>`+
      `<div class="d">5일 <span class="${cls(a5)}">${fm(a5)}</span>${a20!=null?` · 20일 <span class="${cls(a20)}">${fm(a20)}</span>`:''}</div></div>`}).join('');
}

function renderCum(){
  const iv=investor(MK);if(!iv)return;
  const n=Math.min(P,iv.dates.length),st=iv.dates.length-n;
  const d=iv.dates.slice(st);
  const cum=a=>{let s=0;return a.slice(st).map(v=>(s+=(v||0),Math.round(s)))};
  const ds=[['개인',iv.ind,css('--ind')],['외국인',iv.frg,css('--frg')],['기관',iv.inst,css('--inst')]]
    .map(([l,a,c])=>({label:l,data:cum(a),borderColor:c,backgroundColor:c,borderWidth:2,pointRadius:0,tension:.25,yAxisID:'y'}));
  ds.push({label:'지수',data:closes(MK,d),borderColor:'#e8ecf4',borderDash:[4,3],borderWidth:1.2,pointRadius:0,yAxisID:'y2'});
  draw('cumChart',{type:'line',data:{labels:d.map(x=>x.slice(5)),datasets:ds},options:opt({y2:true,eokAxis:true})});
}

function renderInst(){
  const iv=investor(MK);
  if(!iv||!iv.pension){$('instSub').innerHTML='';$('instBox').innerHTML=empty(WAIT);return}
  const i=lastIdx(iv.frg),w=Math.min(P,i+1);
  $('instSub').innerHTML=`최근 ${w}일 합계`+badge(iv.src);
  const rows=INST_KEYS.filter(k=>iv[k]).map(k=>[NAMES[k],sum(iv[k].slice(i-w+1,i+1)),iv[k][i]]);
  $('instBox').innerHTML=bars(rows.map(r=>[r[0],r[1]]))+
    `<div class="note">오늘: ${rows.map(r=>`${r[0]} <span class="${cls(r[2])}">${eok(r[2])}</span>`).join(' · ')}</div>`;
}

function renderProg(){
  const pg=S&&S.program&&S.program[MK];
  if(!pg||!pg.total){$('progBox').innerHTML=empty(WAIT);return}
  const dates=S.program.dates||S.dates,n=Math.min(P,dates.length),st=dates.length-n;
  $('progBox').innerHTML=`<div class="chart"><canvas id="progChart"></canvas></div>`+
    `<div class="legend"><span><i class="dot" style="background:#4fd1c5"></i>차익</span><span><i class="dot" style="background:#f5b942"></i>비차익</span>${badge((S.src||{}).program)}</div>`;
  draw('progChart',{type:'bar',data:{labels:dates.slice(st).map(x=>x.slice(5)),datasets:[
    {label:'차익',data:(pg.arb||[]).slice(st),backgroundColor:'#4fd1c5',stack:'p'},
    {label:'비차익',data:(pg.nonarb||[]).slice(st),backgroundColor:'#f5b942',stack:'p'}]},
    options:opt({stacked:true,eokAxis:true})});
}

function renderFut(){
  const fu=S&&S.futures;
  if(!fu||!fu.dates||!fu.dates.length){$('futBox').innerHTML=empty('선물 투자자 데이터가 아직 없다.');return}
  const n=Math.min(P,fu.dates.length),st=fu.dates.length-n;
  const cum=a=>{let s=0;return (a||[]).slice(st).map(v=>(s+=(v||0),Math.round(s)))};
  $('futBox').innerHTML=`<div class="chart"><canvas id="futChart"></canvas></div>${badge((S.src||{}).futures)}`;
  const ds=[['개인',fu.ind,css('--ind')],['외국인',fu.frg,css('--frg')],['기관',fu.inst,css('--inst')]]
    .map(([l,a,c])=>({label:l,data:cum(a),borderColor:c,backgroundColor:c,borderWidth:2,pointRadius:0,tension:.25}));
  draw('futChart',{type:'line',data:{labels:fu.dates.slice(st).map(x=>x.slice(5)),datasets:ds},options:opt({legend:true})});
}

function renderIntra(){
  const it=S&&S.intraday,m=it&&it[MK];
  if(!m||!it.times||!it.times.length){$('intraSub').innerHTML='';$('intraBox').innerHTML=empty('장중 30분 수집이 켜지면 표시된다(3단계). '+WAIT);return}
  $('intraSub').innerHTML=`${it.date} 누적 순매수`+badge((S.src||{}).intraday);
  $('intraBox').innerHTML=`<div class="chart"><canvas id="intraChart"></canvas></div>`;
  const ds=[['개인',m.ind,css('--ind')],['외국인',m.frg,css('--frg')],['기관',m.inst,css('--inst')],['프로그램',m.prog,'#e8ecf4']]
    .filter(x=>x[1]).map(([l,a,c])=>({label:l,data:a,borderColor:c,backgroundColor:c,borderWidth:2,pointRadius:2,tension:.2}));
  draw('intraChart',{type:'line',data:{labels:it.times,datasets:ds},options:opt({eokAxis:true,legend:true})});
}

function renderSec(){
  const s=S&&S.sectorInv&&S.sectorInv[MK];
  if(!s||!s.length){$('secBox').innerHTML=empty(WAIT);return}
  const top=[...s].sort((a,b)=>(b.frg+b.inst)-(a.frg+a.inst));
  const pick=[...top.slice(0,8),...top.slice(-6)];
  $('secBox').innerHTML=bars(pick.map(x=>[x.name,x.frg+x.inst]))+
    `<div class="note">막대 = 외국인+기관 합계. ${badge((S.src||{}).sectorInv)}</div>`;
}

function renderRank(){
  const r=(S&&S.rank)||{};
  const tabs=[['frgBuy','외국인 매수'],['frgSell','외국인 매도'],['instBuy','기관 매수'],['instSell','기관 매도'],['penBuy','연기금 매수'],['both','동반 매수'],['streak','연속 매수']]
    .filter(([k])=>r[k]&&r[k].length);
  if(!tabs.length&&M&&M.foreignRank){
    const fr=M.foreignRank.map(x=>({...x,unit:'m'}));  // money 앱 amt 단위 = 백만원
    r.frgBuy=fr.filter(x=>x.side==='buy');r.frgSell=fr.filter(x=>x.side==='sell');
    tabs.push(['frgBuy','외국인 매수'],['frgSell','외국인 매도']);r._src='money';
  }
  if(!tabs.length){$('rkTabs').innerHTML='';$('rkBox').innerHTML=empty(WAIT);return}
  if(!RK||!tabs.some(t=>t[0]===RK))RK=tabs[0][0];
  $('rkTabs').innerHTML=tabs.map(([k,l])=>`<button class="tab ${k===RK?'on':''}" data-rk="${k}">${l}</button>`).join('')+badge(r._src||(S&&S.src||{}).rank);
  const rows=r[RK].slice(0,20);
  const nm=x=>x.code?`<a href="../timing/?code=${x.code}">${x.name}</a>`:x.name;
  let h;
  if(RK==='streak')h='<tr><th>종목</th><th>외국인 연속</th><th>기관 연속</th><th>기간 합계</th></tr>'+
    rows.map(x=>`<tr><td>${nm(x)}</td><td>${x.frgDays??'–'}일</td><td>${x.instDays??'–'}일</td><td class="${cls(x.amt)}">${eok(x.amt)}</td></tr>`).join('');
  else if(RK==='both')h='<tr><th>종목</th><th>외국인</th><th>기관</th></tr>'+
    rows.map(x=>`<tr><td>${nm(x)}</td><td class="${cls(x.frg)}">${eok(x.frg)}</td><td class="${cls(x.inst)}">${eok(x.inst)}</td></tr>`).join('');
  else h='<tr><th>종목</th><th>순매수</th><th>업종</th></tr>'+
    rows.map(x=>`<tr><td>${nm(x)}</td><td class="${cls(x.amt)}">${eok(x.unit==='m'?x.amt/100:x.amt)}</td><td style="color:var(--tx2)">${x.sector||''}</td></tr>`).join('');
  $('rkBox').innerHTML=`<table>${h}</table>`;
}

function renderAux(){
  const a=S&&S.aux;
  if(!a||!a.dates||!a.dates.length){$('auxBox').innerHTML=empty(WAIT);return}
  const n=Math.min(P,a.dates.length),st=a.dates.length-n;
  $('auxBox').innerHTML=`<div class="chart"><canvas id="auxChart"></canvas></div>${badge((S.src||{}).aux)}`;
  const ds=[['공매도 거래대금',a.short&&a.short[MK],'#f04452','y'],['대차잔고',a.loan&&a.loan[MK],'#4fd1c5','y2'],['신용잔고',a.credit&&a.credit[MK],'#f5b942','y2']]
    .filter(x=>x[1]).map(([l,d,c,ax])=>({label:l,data:d.slice(st),borderColor:c,backgroundColor:c,borderWidth:2,pointRadius:0,yAxisID:ax}));
  draw('auxChart',{type:'line',data:{labels:a.dates.slice(st).map(x=>x.slice(5)),datasets:ds},options:opt({y2:true,legend:true})});
}

function bars(rows){
  const mx=Math.max(1,...rows.map(r=>Math.abs(r[1]||0)));
  return rows.map(([n,v])=>{
    const w=Math.abs(v||0)/mx*50;
    const pos=v>=0?`left:50%;width:${w}%;background:var(--up)`:`right:50%;width:${w}%;background:var(--dn)`;
    return `<div class="bar-row"><div class="nm" title="${n}">${n}</div><div class="track"><div class="mid"></div><div class="b" style="${pos}"></div></div><div class="val ${cls(v)}">${eok(v)}</div></div>`}).join('');
}

function opt(o={}){
  const grid={color:'#2a3245'},tk={color:'#9aa5b8',font:{size:10}};
  const sc={x:{grid:{display:false},ticks:{...tk,maxRotation:0,autoSkip:true,maxTicksLimit:8},stacked:!!o.stacked},
            y:{grid,ticks:{...tk,callback:v=>o.eokAxis?eok(v):v.toLocaleString()},stacked:!!o.stacked}};
  if(o.y2)sc.y2={position:'right',grid:{display:false},ticks:tk};
  return {responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'index',intersect:false},
    plugins:{legend:{display:!!o.legend,labels:{color:'#9aa5b8',boxWidth:10,font:{size:11}}},
      tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${c.dataset.yAxisID==='y2'?c.parsed.y?.toLocaleString():o.eokAxis?eok(c.parsed.y):c.parsed.y?.toLocaleString()}`}}},
    scales:sc};
}
function draw(id,cfg){if(charts[id])charts[id].destroy();const el=$(id);if(el)charts[id]=new Chart(el,cfg)}

function renderHeader(){
  const u=[];
  if(S&&S.updated)u.push(`수급 앱 ${S.updated}`);
  if(M&&M.updated)u.push(`수급흐름 앱 ${M.updated}`);
  $('updated').innerHTML=(u.join(' · ')||'데이터 없음')+
    `<br>키움 연결: ${S&&S.kiwoom&&S.kiwoom.ok?'<span class="up">사용 중</span>':'<span class="flat">미연결 — 공개 원천으로 표시</span>'}`;
  const errs=[...((S&&S.errors)||[]),...((M&&M.errors)||[])];
  if(errs.length){$('err').style.display='block';$('err').innerHTML='⚠ 수집 오류 '+errs.length+'건<br>'+errs.slice(0,6).join('<br>')}
  const src=(S&&S.src)||{};
  $('srcNote').innerHTML='원천: '+(Object.keys(src).length?Object.entries(src).map(([k,v])=>`${k}=${SRC[v]||v}`).join(' · '):'수급흐름 앱(money/data.json, 네이버 공개 API)')+
    '. 투자자·지수 기본값은 수급흐름 앱 데이터를 함께 쓴다.';
}

function render(){
  renderHeader();
  [renderToday,renderCum,renderInst,renderProg,renderFut,renderIntra,renderSec,renderRank,renderAux].forEach(f=>{
    try{f()}catch(e){console.error(f.name,e)}
  });
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.mk){MK=b.dataset.mk;document.querySelectorAll('#mkTabs .tab').forEach(x=>x.classList.toggle('on',x===b));render()}
  if(b.dataset.p){P=+b.dataset.p;document.querySelectorAll('#pTabs .tab').forEach(x=>x.classList.toggle('on',x===b));render()}
  if(b.dataset.rk){RK=b.dataset.rk;renderRank()}
});

(async()=>{
  [M,S]=await Promise.all([getJSON('../money/data.json'),getJSON('data.json')]);
  render();
})();
</script>
</body>
</html>
