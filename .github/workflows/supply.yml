name: update-supply

on:
  schedule:
    # KST = UTC+9. 평일 09:05~15:35 30분 간격(장중 흐름) + 18:50(장마감 확정)
    - cron: '5,35 0-6 * * 1-5'
    - cron: '50 9 * * 1-5'
  workflow_dispatch:
  push:
    branches: [ 'claude/**' ]
    paths: [ 'supply/collect_supply.py', '.github/workflows/supply.yml' ]

permissions:
  contents: write

# main 에서는 다른 수집 워크플로와 같은 그룹으로 직렬화해 push 충돌을 막는다.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'main-content' || format('supply-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Collect supply data
        env:
          KIWOOM_APPKEY: ${{ secrets.KIWOOM_APPKEY }}
          KIWOOM_SECRETKEY: ${{ secrets.KIWOOM_SECRETKEY }}
        run: python supply/collect_supply.py
      - name: Commit & push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add supply/data.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "supply data $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
            echo "push retry $i"; sleep 5
          done
