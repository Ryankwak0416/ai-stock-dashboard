name: probe-money
on:
  push:
    branches: [claude/fix-money-flow]
    paths: [_probe/**, .github/workflows/probe-money.yml, money/collect_money.py]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Probe sources
        run: python _probe/probe_money.py > _probe/out_probe.txt 2>&1 || true
      - name: Run collector
        run: |
          cp money/data.json /tmp/data_backup.json
          rc=0; python money/collect_money.py > _probe/out_collect.txt 2>&1 || rc=$?; echo "exit=$rc" >> _probe/out_collect.txt
          python -c "import json;d=json.load(open('money/data.json'));D=d['dates'];m=d['market'];v=d['investor'];i=D.index('2026-09-17') if '2026-09-17' in D else 0;print('updated',d['updated'],'n',len(D),D[0],D[-1]);print('tail dates',D[-3:]);[print(k,'close',m[k]['close'][-3:],'value',m[k]['value'][-3:],'0917',m[k]['value'][i]) for k in m];[print(k,'inv',[v[k][x][-3:] for x in ('individual','foreign','institution')],'0917',[v[k][x][i] for x in ('individual','foreign','institution')]) for k in v];print('fx',d['fx'][-3:],'0917',d['fx'][i]);print('nulls value',sum(x is None for k in m for x in m[k]['value']),'inv',sum(x is None for k in v for x in v[k]['individual']),'fx',sum(x is None for x in d['fx']));print('sectors',len(d['sectors']),'histDays',d['histDays']);fr=d['foreignRank'];print('rank',len(fr),[ (r['name'],r['amt'],r['side'],r['sector']) for r in fr[:3]],[(r['name'],r['amt'],r['side']) for r in fr if r['side']=='sell'][:3]);print('errors',d['errors'])" >> _probe/out_collect.txt 2>&1 || true
          cp /tmp/data_backup.json money/data.json
      - name: Save results to branch
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add _probe/out_*.txt
          git commit -m "probe: money-flow source results [skip ci]" || exit 0
          git push
