name: collect-min

on:
  schedule:
    # KST = UTC+9. 평일 09:05~15:05 매시 5분 + 장마감 직후 15:35
    - cron: '5 0-6 * * 1-5'
    - cron: '35 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-min
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pandas

      - name: Collect minute bars
        env:
          KIS_APPKEY: ${{ secrets.KIS_APPKEY }}
          KIS_APPSECRET: ${{ secrets.KIS_APPSECRET }}
        run: python stoch/collect_min.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stoch/min
          if git diff --staged --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "min: 분봉 누적 $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push 재시도 $i"
            sleep 10
          done
          exit 1
