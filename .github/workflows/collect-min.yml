name: collect-min

on:
  schedule:
    # KST = UTC+9. 평일 15:10 KST (야후 분봉이 14:55까지라 장 끝나면 바로 받는다)
    - cron: '10 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-min
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pandas numpy yfinance

      - name: Collect minute bars
        run: python stoch/collect_min.py

      - name: Build probability ledger (확률 대장 · 2026-09-26)
        run: python stoch/prob_build.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stoch/min stoch/prob
          if git diff --staged --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "min: 분봉 누적 $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push 재시도 $i"
            sleep 10
          done
          exit 1
