<style>
:root{--bg:#ffffff;--pan:#f7f8fa;--fg:#1a1a1a;--sub:#6b7280;--line:#e3e5e8;
  --buy:#d92d20;--buyd:#fef3f2;--sell:#1849a9;--selld:#eff6ff;--neu:#9aa0a6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif}

select,button{font:inherit;padding:5px 11px;border:1px solid var(--line);border-radius:999px;

select{border-radius:8px}
button.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a;font-weight:600}

.verdict.sell{border-color:var(--sell);background:var(--selld)} .verdict.sell .big{color:var(--sell)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:18px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:11px;color:var(--sub);font-weight:600;border-bottom:2px solid var(--line)}
th:first-child,td:first-child{text-align:left}

tr.sel{background:#eef2f7}

tr.avg td{background:#f2f4f7;font-weight:600}

.steps{display:flex;gap:0;margin:10px 0 14px;flex-wrap:wrap}

.step:last-child{border-right:1px solid var(--line)}

.step.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.step.on b{color:#fff}
.step.done{background:#f2f4f7;color:var(--sub)}
input[type=text]{font:inherit;padding:5px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--fg);min-width:230px}
.pane{display:none} .pane.on{display:block}
h2{font-size:15px;margin:18px 0 6px}
td.num{font-variant-numeric:tabular-nums}

<body>
<div class="wrap">
<h1>스토캐스틱 주관 매수매도 타이밍</h1>
<p class="sub">막내(5,3) · 둘째(10,6) · 큰형(20,12) — 1분봉부터 월봉까지 같은 방식으로 판정합니다.</p>

<div class="bar">
  <input type="text" id="q" list="tk" placeholder="종목명 또는 코드 검색 (500종목)" autocomplete="off">
  <datalist id="tk"></datalist>
  <select id="sel"></select>
  <span class="sub">컷</span>
  <select id="cut"><option value="20">20 / 80</option><option value="15">15 / 85</option><option value="25">25 / 75</option><option value="30">30 / 70</option></select>
  <span class="sub">추세</span>
  <select id="tr"><option value="3">3봉 전 대비</option><option value="1">1봉 전</option><option value="5">5봉 전</option></select>

  <button id="tabT" class="on">타이밍</button>

<div class="bar" id="spanbar"></div>
<div class="cbox"><canvas id="cv"></canvas></div>
<div class="scrollrow"><button class="sm" id="prev">◀</button><input type="range" id="sc" min="0" max="0" value="0"><button class="sm" id="next">▶</button></div>
<div class="info"><span id="d0">-</span><span id="mid">-</span><span id="d1">-</span></div>
<div class="lg">
  <span><i style="background:#0b1220;height:4px"></i>종가</span>
  <span><i style="background:#e8590c"></i>막내 5·3·3</span>
  <span><i style="background:#0ca678"></i>둘째 10·6·6</span>
  <span><i style="background:#7048e8;height:3px"></i>큰형 20·12·12</span>
  <span>▲ 적극매수 성립(3형제 동시 과매도) · ▼ 적극매도 성립(동시 과매수)</span>
  <span>바탕색 = 이평 배열(붉은 정배열 · 푸른 역배열) · 아래 갈색칸 = 이평 수렴중</span>
</div>

<p class="note" id="foot"></p>

<script>
const MIN=['1m','5m','10m','30m','60m','120m','240m'];
const LBL={'1m':'1분','5m':'5분','10m':'10분','30m':'30분','60m':'60분','120m':'120분','240m':'240분','D':'일봉','W':'주봉','M':'월봉'};
const SUPER=['5m','60m','240m'];
const ROLE={'5m':'단타','60m':'스윙','240m':'추세'};
const RTAG=tf=>ROLE[tf]?`<span class="role">${ROLE[tf]}</span>`:'';
const SPANS=[[60,'60봉'],[120,'120봉'],[250,'250봉'],[0,'전체']];
let CUT=20,TRN=3,CODE=null,TF='60m',SPAN=120,POS=1e9,NAMES={},WL=[],DATA=null,chart=null;
let SHOW={px:true,k5:true,k10:true,k20:true};
const SPANOPT=[30,40,60,80,100,120,160,200,250,300,0];

function sma(a,n){const o=Array(a.length).fill(null);let s=0,c=0;
  for(let i=0;i<a.length;i++){const v=a[i];
    if(v==null){s=0;c=0;o[i]=null;continue;}
    s+=v;c++;if(c>n){s-=a[i-n];c=n;}o[i]=c>=n?s/n:null;}return o;}
// Slow %K / %D — HTS 정식.
// 사장님 HTS가 내보낸 60분봉 900봉으로 역산해 오차 0.0000으로 맞춘 식이다(2026-09-17).
//   %K = Σ(종가 − n기간최저) / Σ(n기간최고 − n기간최저) × 100   (슬로잉 기간 합산)
//   %D = %K의 지수이동평균(EMA, α = 2/(dp+1))
// 이전에 쓰던 SMA(Fast %K) 방식은 최대 22포인트까지 벌어져 20/80 판정이 달라졌다.
function slowStoch(h,l,c,n,sl,dp){
  const N=c.length, hi=Array(N).fill(null), lo=Array(N).fill(null);
  for(let i=n-1;i<N;i++){let hh=-1e18,ll=1e18;
    for(let j=i-n+1;j<=i;j++){if(h[j]>hh)hh=h[j];if(l[j]<ll)ll=l[j];}
    hi[i]=hh;lo[i]=ll;}
  const k=Array(N).fill(null);
  for(let i=n+sl-2;i<N;i++){let num=0,den=0,ok=true;
    for(let j=i-sl+1;j<=i;j++){
      if(hi[j]==null){ok=false;break;}
      num+=c[j]-lo[j];den+=hi[j]-lo[j];}
    if(ok&&den>0)k[i]=num/den*100;}
  const d=Array(N).fill(null),a=2/(dp+1);let p=null;
  for(let i=0;i<N;i++){if(k[i]==null)continue;
    p=(p==null)?k[i]:p+a*(k[i]-p);d[i]=p;}
  return {k,d};}
function trio(h,l,c){return {k5:slowStoch(h,l,c,5,3,3),k10:slowStoch(h,l,c,10,6,6),k20:slowStoch(h,l,c,20,12,12)};}
function regroup(dates,h,l,c,mode){
  const H=[],L=[],C=[],T=[];let key=null;
  const kf=mode==='W'?d=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()-((x.getUTCDay()+6)%7));return x.toISOString().slice(0,10);}:d=>d.slice(0,7);
  for(let i=0;i<dates.length;i++){const k=kf(dates[i]);
    if(k!==key){key=k;T.push(dates[i]);H.push(h[i]);L.push(l[i]);C.push(c[i]);}
    else{const j=H.length-1;if(h[i]>H[j])H[j]=h[i];if(l[i]<L[j])L[j]=l[i];C[j]=c[i];}}
  return {t:T,h:H,l:L,c:C};}
function lastVal(a){for(let i=a.length-1;i>=0;i--)if(a[i]!=null)return a[i];return null;}
function stateAt(K,i){
  const v=[K.k5.k[i],K.k10.k[i],K.k20.k[i]];
  if(v.some(x=>x==null))return {s:0,v,lack:true};
  if(v.every(x=>x<=CUT))return {s:2,v};
  if(v.every(x=>x>=100-CUT))return {s:-2,v};
  const r=a=>{const p=a[i-TRN];return (p==null)?0:(a[i]>p?1:(a[i]<p?-1:0));};
  const d=[r(K.k5.k),r(K.k10.k),r(K.k20.k)];
  const up=d.filter(x=>x>0).length,dn=d.filter(x=>x<0).length;
  return {s:up>=2?1:(dn>=2?-1:0),v};}
function rowState(K){return stateAt(K,K.k5.k.length-1);}
function baseCount(a,w){const n=a.length,st=Math.max(1,n-w);let c=0;
  for(let i=st;i<n;i++)if(a[i]!=null&&a[i-1]!=null&&a[i]<=CUT&&a[i-1]>CUT)c++;return c;}
// 이평 5·10·20·60 상태. a: 1 정배열 / -1 역배열 / 0 중립, cv: 수렴중
// 수렴 판정은 고정 퍼센트가 아니라 그 봉의 변동성 대비다.
// (5분봉에 맞춘 0.4% 고정값은 60·240분봉에서 사실상 한 번도 걸리지 않았다)
const CVR=2.0;   // 이평 폭 / 최근 20봉 평균 변동폭
function maCalc(c,i){
  const m=[5,10,20,60].map(p=>{if(i+1<p)return null;let s=0;for(let j=i-p+1;j<=i;j++)s+=c[j];return s/p;});
  if(m[2]==null||m[3]==null)return{a:0,cv:false};
  const px=c[i];
  // 배열은 20·60 두 선의 위아래만 본다. 가격 위치까지 걸면 잔파동에 「중립」이 절반 가까이 나와
  // 분봉 칸이 계속 「—」로 비어 보인다.
  const a=(m[2]>m[3])?1:((m[2]<m[3])?-1:0);
  let cv=false;
  if(i>=20){let v=0;for(let j=i-19;j<=i;j++)v+=Math.abs(c[j]-c[j-1])/c[j];v/=20;
    if(v>0)cv=((Math.max(...m)-Math.min(...m))/px)/v<CVR;}
  return{a,cv};}
function maAt(c,i){const s=maCalc(c,i);return s.cv?2:s.a;}
function maState(c){return maCalc(c,c.length-1);}
function toEpoch(s){return Math.floor(new Date(s+'T15:30:00+09:00').getTime()/1000);}
function fmtT(t){if(t==null)return '-';
  if(typeof t==='number'){const d=new Date(t*1000),p=n=>String(n).padStart(2,'0');
    return `${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
  return String(t).slice(2);}

async function loadOne(code){
  const [mn,dl]=await Promise.all([
    fetch(`../stoch/min/${code}.json?t=${Date.now()}`).then(r=>r.ok?r.json():null).catch(()=>null),
    fetch(`../stoch/data/${code}.json?t=${Date.now()}`).then(r=>r.ok?r.json():null).catch(()=>null)]);
  const rows=[];
  if(mn&&mn.sig)for(const tf of MIN){const s=mn.sig[tf];if(!s)continue;
    rows.push({tf,label:LBL[tf],ts:s.t,c:s.c,
      K:{k5:{k:s.k5k,d:s.k5d},k10:{k:s.k10k,d:s.k10d},k20:{k:s.k20k,d:s.k20d}}});}
  if(dl&&dl.close)for(const md of ['D','W','M']){
    const g=md==='D'?{t:dl.dates,h:dl.high,l:dl.low,c:dl.close}:regroup(dl.dates,dl.high,dl.low,dl.close,md);
    rows.push({tf:md,label:LBL[md],ts:g.t,c:g.c,K:trio(g.h,g.l,g.c)});}
  return {mn,dl,rows};}

const SN={2:'적극매수',1:'상승추세',0:'중립','-1':'하락추세','-2':'적극매도'};
const SC={2:'c2',1:'c1',0:'c0','-1':'cm1','-2':'cm2'};
const fk=x=>x==null?'-':Math.round(x);
const kc=x=>x==null?'<span class="c0">-</span>':(x<=CUT?`<span class="lo">${Math.round(x)}</span>`:(x>=100-CUT?`<span class="hi">${Math.round(x)}</span>`:Math.round(x)));

// 2026-09-17 검증 반영 —
// 적극매도는 24종목 1,000여 건에서 전 구간 음수였고(60분 944건 승률 44%),
// 정배열에서 특히 나빴다(240분 40봉 −4.08%). 그래서 정배열 칸의 적극매도는
// 「과열 주의」로 격하하고 점수·개수·수퍼매도 판정에서 빼둔다. 신호 자체는 그대로 보여준다.
// 2026-09-17 되돌림 —
// 이 함수는 정배열 칸의 적극매도를 「과열 주의」로 격하하고 있었다. 근거였던 검증 수치가
// 틀린 스토캐스틱 식(SMA 방식)으로 계산된 것이어서 근거가 사라졌다. HTS 정식으로 다시
// 검증한 뒤 다시 넣을지 정한다. 지금은 원래 판정을 그대로 통과시킨다.
function effState(r,st){
  return {s:st[r.tf].s,hot:false};}

function head(){
  const data=DATA,st={};data.rows.forEach(r=>st[r.tf]=rowState(r.K));
  const ef={};data.rows.forEach(r=>ef[r.tf]=effState(r,st));
  const SV=data.rows.filter(r=>!st[r.tf].lack).map(r=>ef[r.tf]);
  const nB=SV.filter(x=>x.s>0).length,nSB=SV.filter(x=>x.s===2).length;
  const nS=SV.filter(x=>x.s<0).length,nSS=SV.filter(x=>x.s===-2).length,tot=SV.length;
  const nHot=SV.filter(x=>x.hot).length;
  const sup=SUPER.every(tf=>ef[tf]&&ef[tf].s===2),supS=SUPER.every(tf=>ef[tf]&&ef[tf].s===-2);
  let vc='',vt,vs;
  if(sup){vc='buy';vt='★ 수퍼매수 타이밍';vs='5분·60분·240분봉이 동시에 적극매수입니다.';}
  else if(supS){vc='sell';vt='★ 수퍼매도 타이밍';vs='5분·60분·240분봉이 동시에 적극매도입니다.';}
  else if(nSB>=3){vc='buy';vt='적극매수 우세';vs=tot+'칸 중 '+nSB+'칸이 적극매수입니다.';}
  else if(nSS>=3){vc='sell';vt='적극매도 우세';vs=tot+'칸 중 '+nSS+'칸이 적극매도입니다.';}
  else if(nB>nS){vc='buy';vt='매수 우위';vs='적극매수 칸은 적습니다. 상승추세 위주입니다.';}
  else if(nS>nB){vc='sell';vt='매도 우위';vs='적극매도 칸은 적습니다. 하락추세 위주입니다.';}
  else{vt='중립';vs='어느 쪽으로도 기울지 않았습니다.';}
  const px=data.rows[0].c[data.rows[0].c.length-1];
  document.getElementById('vd').innerHTML=
    `<div class="verdict ${vc}"><div class="big">${vt}</div><div class="meta">${data.dl?data.dl.name:CODE} ${CODE} · `
    +`${px!=null?(+px).toLocaleString():'-'} · ${tot}칸 중 <b>매수 ${nB}</b>(적극 ${nSB}) / <b>매도 ${nS}</b>(적극 ${nSS})`
    +`${nHot?` · <span class="tag hot">과열 ${nHot}</span>`:''} · ${vs}</div></div>`;

  const mR=data.rows.filter(r=>MIN.includes(r.tf)),mOK=mR.filter(r=>!st[r.tf].lack);
  const mAvg=mOK.length?mOK.reduce((x,r)=>x+ef[r.tf].s,0)/mOK.length:null;
  const aS=mAvg==null?0:(mAvg>=1.5?2:mAvg>=.5?1:mAvg<=-1.5?-2:mAvg<=-.5?-1:0);
  const rowHtml=r=>{
    const s=st[r.tf],e=ef[r.tf],ma=maState(r.c),bc=baseCount(r.K.k5.k,60);
    const lbl=s.lack?'<span class="c0">데이터 부족</span>'
             :e.hot?'<span class="tag hot">과열 주의</span>':SN[s.s];
    return `<tr class="pick ${r.tf===TF?'sel':''}" data-tf="${r.tf}">
      <td><b>${r.label}</b>${RTAG(r.tf)}</td>
      <td class="st ${e.hot?'':SC[s.s]}">${lbl}</td>
      <td>${kc(s.v[0])}</td><td>${kc(s.v[1])}</td><td>${kc(s.v[2])}</td>

// ───────── 검증 (매수·매도 결과) ─────────
let VHOLD=20, VROWS=null, VTAB=false, VMODE='one', VALL=null;
const HOLDS=[5,10,20,40];

function dayKey(t){return Math.floor((t+32400)/86400);}   // KST 기준 날짜

function chunkDay(o,k){
  const ts=[],h=[],l=[],c=[];
  let i=0;
  while(i<o.ts.length){
    const d=dayKey(o.ts[i]);
    let j=i;
    while(j<o.ts.length&&dayKey(o.ts[j])===d){
      const e=Math.min(j+k,o.ts.length);
      let hi=-1e18,lo=1e18;
      let m=j;
      for(;m<e&&dayKey(o.ts[m])===d;m++){if(o.h[m]>hi)hi=o.h[m];if(o.l[m]<lo)lo=o.l[m];}
      ts.push(o.ts[j]);h.push(hi);l.push(lo);c.push(o.c[m-1]);
      j=m;}
    i=j;}
  return {ts,h,l,c};}

// 누적 원본(gz)을 받아 훨씬 긴 이력으로 다시 계산한다. 화면용 300봉으로는 표본이 모자란다.
async function loadRawRows(code){
  try{
    const r=await fetch(`../stoch/min/raw/${code}.json.gz?t=${Date.now()}`);
    if(!r.ok)return null;
    const txt=await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).text();
    const d=JSON.parse(txt);
    const o={};
    for(const tf of ['1m','5m','30m','60m'])if(d[tf]&&d[tf].t&&d[tf].t.length>80)
      o[tf]={ts:d[tf].t,h:d[tf].h,l:d[tf].l,c:d[tf].c};
    if(o['5m'])o['10m']=chunkDay(o['5m'],2);
    if(o['60m']){o['120m']=chunkDay(o['60m'],2);o['240m']=chunkDay(o['60m'],4);}
    const out=[];
    for(const tf of MIN)if(o[tf])out.push({tf,label:LBL[tf],ts:o[tf].ts,c:o[tf].c,K:trio(o[tf].h,o[tf].l,o[tf].c)});
    return out.length?out:null;
  }catch(e){return null;}}

// 신호가 «새로» 성립한 봉만 골라 hold봉 뒤 수익률을 잰다. 매도는 부호를 뒤집어 「맞았는가」로 본다.
function sigList(row,want,hold){
  const K=row.K,c=row.c,n=c.length,out=[];
  for(let i=1;i+hold<n;i++){
    const q=stateAt(K,i);if(q.lack||q.s!==want)continue;
    const p=stateAt(K,i-1);if(p.s===want)continue;
    const ret=(c[i+hold]-c[i])/c[i]*100*(want===2?1:-1);
    out.push({i,ret,a:maCalc(c,i).a});}
  return out;}

function agg(list){
  if(!list.length)return null;
  const w=list.filter(x=>x.ret>0).length;
  const m=list.reduce((s,x)=>s+x.ret,0)/list.length;
  return {n:list.length,win:w/list.length*100,avg:m};}

function cell(a){
  if(!a)return '<td class="num small">-</td><td class="num small">-</td>';
  const wc=a.win>=50?'pos':'neg', ac=a.avg>0?'pos':'neg';
  return `<td class="num"><span class="${wc}">${a.win.toFixed(0)}%</span> <span class="small">${a.n}</span></td>`
        +`<td class="num ${ac}">${a.avg>0?'+':''}${a.avg.toFixed(2)}%</td>`;}

function vTable(rows,want,hold){
  const title=want===2?'적극매수':'적극매도';
  let body='',tot=[],totP=[],totN=[];
  for(const r of rows){
    const L=sigList(r,want,hold);
    tot=tot.concat(L);
    const P=L.filter(x=>x.a>0),N=L.filter(x=>x.a<0);
    totP=totP.concat(P);totN=totN.concat(N);
    body+=`<tr><td><b>${r.label}</b>${RTAG(r.tf)}<span class="small"> ${r.c.length}봉</span></td>`
        +cell(agg(L))+cell(agg(P))+cell(agg(N))+'</tr>';}
  body+=`<tr class="avg"><td><b>합계</b></td>`+cell(agg(tot))+cell(agg(totP))+cell(agg(totN))+'</tr>';
  return `<h2>${title} 결과 · ${hold}봉 뒤</h2>
    <table><thead><tr><th>봉</th>
      <th colspan="2" style="text-align:left">전체 (승률·표본 / 평균)</th>
      <th colspan="2" style="text-align:left">정배열에서 난 신호</th>
      <th colspan="2" style="text-align:left">역배열에서 난 신호</th></tr></thead>
    <tbody>${body}</tbody></table>`;}

// ── 관심종목 전체 합산 ──────────────────────────────
// 한 종목 한 구간의 수십 건으로는 정배열 가점 같은 조건을 판정할 수 없다.
// 관심종목 전부의 신호를 한 통에 모아야 숫자가 흔들리지 않는다.
async function loadAll(prog){
  const out=[];
  const codes=WL.slice();
  let done=0;
  const work=async ()=>{
    while(codes.length){
      const c=codes.shift();
      const r=await loadRawRows(c);
      done++; if(prog)prog(done,WL.length);
      if(r)out.push({code:c,rows:r});
    }};
  await Promise.all([work(),work(),work(),work()]);
  return out;}

function vTableAll(all,want,hold){
  const title=want===2?'적극매수':'적극매도';
  const byTf={};
  for(const t of all)for(const r of t.rows){
    (byTf[r.tf]=byTf[r.tf]||[]).push(...sigList(r,want,hold));}
  let body='',tot=[],totP=[],totN=[];
  for(const tf of MIN){
    const L=byTf[tf]; if(!L||!L.length)continue;
    const P=L.filter(x=>x.a>0),N=L.filter(x=>x.a<0);
    tot=tot.concat(L);totP=totP.concat(P);totN=totN.concat(N);
    body+=`<tr><td><b>${LBL[tf]}</b>${RTAG(tf)}</td>`+cell(agg(L))+cell(agg(P))+cell(agg(N))+'</tr>';}
  body+=`<tr class="avg"><td><b>합계</b></td>`+cell(agg(tot))+cell(agg(totP))+cell(agg(totN))+'</tr>';
  return `<h2>${title} 결과 · ${hold}봉 뒤 · ${all.length}종목 합산</h2>
    <table><thead><tr><th>봉</th>
      <th colspan="2" style="text-align:left">전체 (승률·표본 / 평균)</th>
      <th colspan="2" style="text-align:left">정배열에서 난 신호</th>
      <th colspan="2" style="text-align:left">역배열에서 난 신호</th></tr></thead>
    <tbody>${body}</tbody></table>`;}


// ═══════════ 60분봉 매매세팅 검증 ═══════════
// 기준① 단독(첫 봉 진입·고정 청산)이 아니라 «세팅 규칙 그대로» 잰다.
//   진입 = 60분 큰형이 20 아래로 갔다가 20 위로 복귀하는 봉(반등 확인)
//   청산 = 80 위에서 %K가 %D를 하향돌파(데드크로스)
// 한 사이클은 다음 20↓ 진입 전까지다. 수수료·세금은 넣지 않았다.
function g240At(r240,ts){
  if(!r240)return null;
  const T=r240.ts,K=r240.K.k20.k;
  let lo=0,hi=T.length-1,idx=-1;
  while(lo<=hi){const m=(lo+hi)>>1;if(T[m]<=ts){idx=m;lo=m+1;}else hi=m-1;}
  return idx<0?null:K[idx];}

function setCycles(r60,r240){
  const K=r60.K.k20.k,D=r60.K.k20.d,C=r60.c,N=K.length,out=[];
  let i=1;
  while(i<N){
    if(!(K[i]!=null&&K[i]<=20&&K[i-1]!=null&&K[i-1]>20)){i++;continue;}
    const s=i;
    let j=i+1;
    while(j<N&&!(K[j]!=null&&K[j]>20&&K[j-1]!=null&&K[j-1]<=20))j++;
    if(j>=N)break;
    const e=j;
    let lim=e+1;
    while(lim<N&&!(K[lim]!=null&&K[lim]<=20&&K[lim-1]!=null&&K[lim-1]>20))lim++;
    lim=Math.min(lim,N-1);
    const f=(cond,frm)=>{for(let k=(frm==null?e:frm);k<=lim;k++)if(cond(k))return k;return null;};
    const i80=f(k=>K[k]!=null&&K[k]>=80);
    const dead=i80==null?null:f(k=>K[k]!=null&&D[k]!=null&&K[k-1]!=null&&D[k-1]!=null&&K[k]<D[k]&&K[k-1]>=D[k-1]&&K[k-1]>=80,i80);
    const iout=i80==null?null:f(k=>K[k]!=null&&K[k]<80,i80);
    const ibend=i80==null?null:f(k=>k>=3&&K[k]!=null&&K[k-3]!=null&&K[k]<K[k-3]&&K[k-3]>=80,i80);
    let low=Infinity,peak=-Infinity;
    for(let k=s;k<=e;k++)if(C[k]<low)low=C[k];
    for(let k=e;k<=(dead==null?lim:dead);k++)if(C[k]>peak)peak=C[k];
    // 무산(80 미도달) 사이클도 결과에 넣어야 공평하다. 두 가지로 센다.
    //   hold — 사이클을 넘겨서라도 데드크로스가 올 때까지 기다린다(사람이 실제로 하는 쪽)
    //   cut  — 다음 20↓ 진입 시점에 손절하고 새 사이클로 간다
    let held=null;
    for(let k=(i80==null?e:i80);k<N;k++){
      if(K[k]==null||D[k]==null||K[k-1]==null||D[k-1]==null)continue;
      if(K[k]<D[k]&&K[k-1]>=D[k-1]&&K[k-1]>=80){held=k;break;}}
    out.push({s,e,i80,dead,iout,ibend,lim,held,ep:C[e],low,peak,g:g240At(r240,r60.ts[e])});
    i=Math.max(e+1,lim);}
  return out;}

function pct(C,i,ep){return i==null?null:(C[i]-ep)/ep*100;}
function stat(v){
  if(!v.length)return null;
  return {n:v.length,win:v.filter(x=>x>0).length/v.length*100,avg:v.reduce((a,b)=>a+b,0)/v.length,
          worst:Math.min(...v),best:Math.max(...v)};}
function scell(a){
  if(!a)return '<td class="num small">-</td><td class="num small">-</td>';
  return `<td class="num"><span class="${a.win>=50?'pos':'neg'}">${a.win.toFixed(0)}%</span> <span class="small">${a.n}</span></td>`
        +`<td class="num ${a.avg>0?'pos':'neg'}">${a.avg>0?'+':''}${a.avg.toFixed(2)}%</td>`;}

// 한 종목의 사이클을 규칙별·240분 수준별로 집계
function setAgg(r60,r240){
  const cy=setCycles(r60,r240),C=r60.c;
  const R={hold:[],cut:[],dead:[],out80:[],bend:[],hit80:[],peak:[],dd:[],
           miss:0,n:cy.length,g:{lo:[],mid:[],hi:[],na:[]}};
  for(const c of cy){
    // ① 전체 사이클 — 무산 포함
    const hd=pct(C,c.held,c.ep);
    if(hd!=null)R.hold.push(hd);
    const cutIdx=(c.dead!=null)?c.dead:c.lim;
    const ct=pct(C,cutIdx,c.ep);
    if(ct!=null){
      R.cut.push(ct);
      const g=c.g;
      (g==null?R.g.na:(g<30?R.g.lo:(g>70?R.g.hi:R.g.mid))).push(ct);}
    if(c.i80==null)R.miss++;
    // ② 80에 닿은 사이클만 — 청산 규칙 비교용
    const d=pct(C,c.dead,c.ep); if(d!=null)R.dead.push(d);
    const o=pct(C,c.iout,c.ep); if(o!=null)R.out80.push(o);
    const b=pct(C,c.ibend,c.ep); if(b!=null)R.bend.push(b);
    const h=pct(C,c.i80,c.ep); if(h!=null)R.hit80.push(h);
    if(c.peak>-Infinity&&c.dead!=null)R.peak.push((c.peak-c.ep)/c.ep*100);
    if(c.low<Infinity)R.dd.push((c.low-c.ep)/c.ep*100);}
  return {cy,R};}

function setTables(list){   // list: [{code,r60,r240}]
  const M={hold:[],cut:[],dead:[],out80:[],bend:[],hit80:[],peak:[],dd:[]},
        G={lo:[],mid:[],hi:[]}, per=[]; let miss=0,tot=0;
  for(const x of list){
    const {R}=setAgg(x.r60,x.r240);
    for(const k in M)M[k]=M[k].concat(R[k]);
    for(const k of ['lo','mid','hi'])G[k]=G[k].concat(R.g[k]);
    miss+=R.miss; tot+=R.n;
    const st=stat(R.hold);
    if(st)per.push({code:x.code,st});}
  per.sort((a,b)=>b.st.avg-a.st.avg);
  const row=(nm,a,note)=>`<tr><td><b>${nm}</b></td>${scell(a)}<td class="num small">${a?((a.worst>0?'+':'')+a.worst.toFixed(1)+'%'):'-'}</td><td class="small">${note||''}</td></tr>`;
  let html=`<h2>전체 사이클 — 무산 포함</h2>
    <table><thead><tr><th>무산 처리 방식</th><th colspan="2" style="text-align:left">승률·건수 / 평균</th><th>최악</th><th style="text-align:left">뜻</th></tr></thead><tbody>
    ${row('끝까지 보유',stat(M.hold),'80에 못 닿아도 데드크로스가 올 때까지 기다린다')}
    ${row('다음 20↓에서 손절',stat(M.cut),'무산되면 다음 사이클 진입 시점에 정리한다')}
    </tbody></table>
    <p class="note" style="margin:0 0 4px">사이클 ${tot}개 중 <b>${miss}개(${(miss/tot*100).toFixed(0)}%)가 80에 못 닿고 무산</b>됐습니다.
    아래 «청산 규칙 비교»는 <b>80에 닿은 ${tot-miss}개만</b>으로 낸 것이라 승률이 높게 나옵니다 — 규칙끼리 견줄 때만 보십시오.</p>
    <h2>청산 규칙 비교 · 80에 닿은 사이클만</h2>
    <table><thead><tr><th>청산 규칙</th><th colspan="2" style="text-align:left">승률·건수 / 평균</th><th>최악</th><th style="text-align:left">비고</th></tr></thead><tbody>
    ${row('데드크로스',stat(M.dead),'80 위에서 %K가 %D 하향돌파 — 세팅 기본값')}
    ${row('80 이탈',stat(M.out80),'큰형이 80 아래로')}
    ${row('큰형 3봉 꺾임',stat(M.bend),'')}
    ${row('80 도달 즉시',stat(M.hit80),'가장 이르다')}
    ${row('사이클 최고가',stat(M.peak),'도달 불가능한 상한 — 비교용')}
    </tbody></table>`;
  const dq=stat(M.dd);
  html+=`<h2>240분 수준별 · 무산 포함(손절 방식)</h2>
    <table><thead><tr><th>진입 시 240분 큰형</th><th colspan="2" style="text-align:left">승률·건수 / 평균</th><th style="text-align:left">읽는 법</th></tr></thead><tbody>
    <tr><td><b>30 미만</b></td>${scell(stat(G.lo))}<td class="small">상위도 같이 무너진 자리</td></tr>
    <tr><td><b>30 ~ 70</b></td>${scell(stat(G.mid))}<td class="small">상위에 여력 있는 자리</td></tr>
    <tr><td><b>70 초과</b></td>${scell(stat(G.hi))}<td class="small">상위가 이미 과열</td></tr>
    </tbody></table>
    <p class="note" style="margin-top:0">진입 후 반등까지 감수한 폭은 평균 ${dq?dq.avg.toFixed(1):'-'}%, 최악 ${dq?dq.worst.toFixed(1):'-'}%입니다 — 손절선의 근거입니다.</p>`;
  if(per.length>1){
    html+=`<h2>종목별 · 끝까지 보유</h2><table><thead><tr><th>종목</th>
      <th colspan="2" style="text-align:left">승률·건수 / 평균</th><th>최악</th><th>최고</th></tr></thead><tbody>`;
    for(const x of per)html+=`<tr><td><b>${NAMES[x.code]||x.code}</b> <span class="small">${x.code}</span></td>${scell(x.st)}
      <td class="num small">${x.st.worst.toFixed(1)}%</td><td class="num small">+${x.st.best.toFixed(1)}%</td></tr>`;
    html+='</tbody></table>';}
  return html;}

function setCycleTable(r60,r240){
  const {cy}=setAgg(r60,r240), C=r60.c;
  const last=cy.slice(-14).reverse();
  let b='';
  for(const c of last){
    const d=pct(C,c.dead,c.ep);
    const g=c.g;
    const gt=g==null?'-':(g<30?`<span class="neg">${g.toFixed(0)}</span>`:(g>70?`<span class="small">${g.toFixed(0)}</span>`:`<span class="pos">${g.toFixed(0)}</span>`));
    b+=`<tr><td class="small">${fmtT(r60.ts[c.s])}</td><td class="small">${fmtT(r60.ts[c.e])}</td>
      <td class="num">${(+c.ep).toLocaleString()}</td>
      <td class="num small">${((c.low-c.ep)/c.ep*100).toFixed(1)}%</td>
      <td class="num">${gt}</td>
      <td class="small">${c.dead==null?(c.i80==null?'<span class="neg">무산</span>':'80 도달·청산 전'):fmtT(r60.ts[c.dead])}</td>
      <td class="num ${d==null?'small':(d>0?'pos':'neg')}">${d==null?'-':((d>0?'+':'')+d.toFixed(2)+'%')}</td>
      <td class="num small">+${((c.peak-c.ep)/c.ep*100).toFixed(1)}%</td></tr>`;}
  return `<h2>최근 사이클 ${last.length}건</h2>
    <table><thead><tr><th>20↓ 시작</th><th>진입(20↑)</th><th>진입가</th><th>진입전 최저</th>
      <th>240분</th><th style="text-align:left">청산(데드크로스)</th><th>수익률</th><th>구간최고</th></tr></thead>
    <tbody>${b}</tbody></table>`;}

       일·주·월봉은 일봉 500봉 기준입니다.<br>

// ═══════════ 60분봉 매매세팅 ═══════════
// 기준봉은 60분봉 하나다. 240분봉은 상위 제약, 5분봉은 분할 진입용이다.
// 규칙(2026-09-17 대화 + KODEX 반도체레버리지 60분봉 900봉 실측):
//   매수 조건 성립 = 60분 큰형 20 이하  →  이 구간에서 5분봉을 보며 분할매수
//   매수 시점      = 60분 큰형이 20 위로 복귀(반등 확인)
//   적극매수       = 60분 3형제가 동시에 20 이하

//   매도 시점      = 80 위에서 %K가 %D를 하향돌파(데드크로스). 실측 4사이클 평균 +22.4%
//   상위 제약      = 240분 큰형이 20 근처로 무너져 있으면 60분 반등은 무산됐다(7월 폭락기 5연속)
let SROWS=null, SSPAN=3, SCH={};
const SSPANS=[[0.7,'좁게'],[1,'기본'],[1.6,'넓게'],[2.6,'아주 넓게']];
const SBASE={'240m':60,'60m':120,'5m':140};
const SROLE={'60m':['메인','큰형 바닥 → 매수 / 큰형 80 → 매도'],
             '5m':['분할','단기 고·저점으로 담는 자리를 정한다'],
             '240m':['흐름','큰 흐름만 본다']};
// 화면 배치 = 위에서 아래로 60분(메인) → 5분(분할) → 240분(흐름)
const SORD=[['60m','cvS6'],['5m','cvS5'],['240m','cvS4']];
let SMUL=1;

function sSeries(tf){return SROWS?SROWS.find(r=>r.tf===tf):null;}

// 60분 큰형으로 사이클을 읽는다
function cyc60(r){
  const K=r.K.k20.k, D=r.K.k20.d, N=K.length;
  const ZL=[],ZH=[],BUY=[],SELL=[];
  let lo=null,hi=null;
  for(let i=1;i<N;i++){
    if(K[i]==null){continue;}
    if(K[i]<=20){if(lo==null)lo=i;}
    else if(lo!=null){ZL.push([lo,i-1]);BUY.push(i);lo=null;}
    if(K[i]>=80){if(hi==null)hi=i;}
    else if(hi!=null){ZH.push([hi,i-1]);hi=null;}
    if(D[i]!=null&&D[i-1]!=null&&K[i-1]!=null&&K[i]<D[i]&&K[i-1]>=D[i-1]&&K[i-1]>=80)SELL.push(i);
  }
  if(lo!=null)ZL.push([lo,N-1]);
  if(hi!=null)ZH.push([hi,N-1]);
  // 현재 단계 — 마지막 20 이하 진입부터 추적
  let stage='대기', sIdx=null;
  for(let i=N-1;i>=1;i--){if(K[i]!=null&&K[i]<=20){sIdx=i;break;}}
  if(sIdx!=null){
    const rb=BUY.filter(i=>i>sIdx)[0];
    const i80=ZH.map(z=>z[0]).filter(i=>i>sIdx)[0];
    const dd=SELL.filter(i=>i>sIdx)[0];
    if(dd!=null)stage='청산 완료';
    else if(i80!=null)stage='매도 준비';
    else if(rb!=null)stage='보유';
    else stage='분할매수';
    if(K[N-1]!=null&&K[N-1]<=20)stage='분할매수';
  }
  return {ZL,ZH,BUY,SELL,stage,k:K[N-1],d:D[N-1]};
}

// 5분봉 분할 트리거 — 각 형제가 20 아래로 새로 내려온 자리
// 사장님 사양 — 5분 큰형은 «바닥을 찍으면», 둘째·막내는 «20 이하로 내려오면» 분할매수 가능
function split5(r){
  const out=[];
  for(const [key,nm] of [['k5','막내'],['k10','둘째']]){
    const a=r.K[key].k;
    for(let i=1;i<a.length;i++)
      if(a[i]!=null&&a[i-1]!=null&&a[i]<=20&&a[i-1]>20)out.push({i,nm});}
  const b=r.K.k20.k;                       // 큰형 = 하락하다 반전 상승(저점이 30 이하)
  for(let i=2;i<b.length;i++)
    if(b[i]!=null&&b[i-1]!=null&&b[i-2]!=null&&b[i-1]<=30&&b[i]>b[i-1]&&b[i-1]<=b[i-2])
      out.push({i,nm:'큰형'});
  return out.sort((x,y)=>x.i-y.i);
}

function gate240(r){
  if(!r)return {cls:'mid',txt:'240분 데이터 없음',v:null};
  const K=r.K.k20.k, v=K[K.length-1];
  if(v==null)return {cls:'mid',txt:'240분 계산 불가',v:null};
  // 2026-09-17 재검증 — 24종목·무산 포함 1,464 사이클에서
  // 30미만 756건 38% / 30~70 607건 39% / 70초과 89건 27%.
  // «30 미만이 위험»은 11건짜리 단일 종목 관찰이어서 근거가 없었다. 70 초과만 경고한다.
  if(v>70)return {cls:'no',txt:`240분 큰형 ${v.toFixed(0)} — 큰 흐름이 이미 과열. 실측 89건 승률 27%로 가장 나빴다`,v};
  if(v<30)return {cls:'ok',txt:`240분 큰형 ${v.toFixed(0)} — 큰 흐름도 낮다. 실측상 30~70과 차이 없다(38 vs 39%)`,v};
  return {cls:'ok',txt:`240분 큰형 ${v.toFixed(0)} — 큰 흐름 무리 없음`,v};
}

function drawSet(tf,cid,r,cy,sp5){
  const N=r.c.length, span=Math.min(Math.round(SBASE[tf]*SMUL),N), a=N-span, b=N-1;
  const labels=[],px=[],k5=[],k10=[],k20=[];
  for(let i=a;i<=b;i++){labels.push(fmtT(r.ts[i]));px.push(r.c[i]);
    k5.push(r.K.k5.k[i]);k10.push(r.K.k10.k[i]);k20.push(r.K.k20.k[i]);}
  const ln=(d,col,w,ax,o)=>({data:d,borderColor:col,borderWidth:w,pointRadius:0,tension:.25,yAxisID:ax,order:o});
  const ds=[ln(px,'rgba(255,255,255,.95)',6,'y',2), ln(px,'#0b1220',3,'y',1),
            ln(k5,'#e8590c',1.1,'y2',3), ln(k10,'#0ca678',1.1,'y2',3), ln(k20,'#7048e8',1.9,'y2',3),
            {data:labels.map(()=>20),borderColor:'rgba(217,45,32,.45)',borderWidth:1,borderDash:[5,4],pointRadius:0,yAxisID:'y2',order:4},
            {data:labels.map(()=>80),borderColor:'rgba(24,73,169,.45)',borderWidth:1,borderDash:[5,4],pointRadius:0,yAxisID:'y2',order:4}];
  const NM=[null,'종가','막내','둘째','큰형'];
  const plug={id:'s'+tf,beforeDatasetsDraw(ch){
    const ca=ch.chartArea,xs=ch.scales.x;if(!ca||!xs)return;const g=ch.ctx;
    const X=i=>xs.getPixelForValue(i-a);
    if(tf==='60m'){
      const zone=(list,fill)=>list.forEach(z=>{const s0=Math.max(z[0],a),e0=Math.min(z[1],b);
        if(e0<a||s0>b)return;const x1=X(s0),x2=X(e0);
        g.save();g.fillStyle=fill;g.fillRect(x1-1,ca.top,Math.max(2,x2-x1+2),ca.bottom-ca.top);g.restore();});
      zone(cy.ZL,'rgba(217,45,32,.13)');zone(cy.ZH,'rgba(24,73,169,.13)');
      const mark=(list,col,dir,tx)=>list.forEach(i=>{if(i<a||i>b)return;const x=X(i);
        g.save();g.strokeStyle=col;g.lineWidth=1.3;g.setLineDash([5,4]);
        g.beginPath();g.moveTo(x,ca.top);g.lineTo(x,ca.bottom);g.stroke();g.setLineDash([]);
        g.fillStyle=col;g.beginPath();
        if(dir>0){g.moveTo(x,ca.bottom-8);g.lineTo(x-7,ca.bottom-22);g.lineTo(x+7,ca.bottom-22);}
        else{g.moveTo(x,ca.top+4);g.lineTo(x-7,ca.top+18);g.lineTo(x+7,ca.top+18);}
        g.closePath();g.fill();g.strokeStyle='#fff';g.lineWidth=1.4;g.stroke();
        g.font='bold 11px -apple-system,Malgun Gothic,sans-serif';g.textAlign='center';
        const ty=(dir>0)?ca.bottom-26:ca.top+31, w=g.measureText(tx).width+8;
        g.fillStyle='rgba(255,255,255,.88)';g.fillRect(x-w/2,ty-11,w,14);
        g.fillStyle=col;g.fillText(tx,x,ty);g.restore();});
      mark(cy.BUY,'#d92d20',1,'매수');
      mark(cy.SELL,'#1849a9',-1,'청산');
    }
    if(tf==='5m'&&sp5){
      const COL={'막내':'#e8590c','둘째':'#0ca678','큰형':'#7048e8'};
      sp5.forEach(m=>{if(m.i<a||m.i>b)return;const x=X(m.i);
        g.save();g.fillStyle=COL[m.nm];
        g.beginPath();g.moveTo(x,ca.bottom-6);g.lineTo(x-5,ca.bottom-16);g.lineTo(x+5,ca.bottom-16);
        g.closePath();g.fill();
        g.font='10px -apple-system,Malgun Gothic,sans-serif';g.textAlign='center';
        g.fillText(m.nm[0],x,ca.bottom-19);g.restore();});
    }
  }};
  if(SCH[cid])SCH[cid].destroy();
  SCH[cid]=new Chart(document.getElementById(cid),{type:'line',data:{labels,datasets:ds},plugins:[plug],
    options:{responsive:true,maintainAspectRatio:false,animation:false,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>NM[c.datasetIndex]?
        NM[c.datasetIndex]+' '+(c.parsed.y==null?'-':Math.round(c.parsed.y*10)/10):null}}},
      scales:{x:{ticks:{color:'#6b7280',maxTicksLimit:7,font:{size:9}},grid:{display:false}},
        y:{position:'left',ticks:{color:'#6b7280',font:{size:9}},grid:{color:'#eceef1'}},
        y2:{position:'right',min:0,max:100,ticks:{color:'#6b7280',stepSize:20,font:{size:9}},grid:{display:false}}}}});
  return {span,a,b};
}

async function renderS(){
  const el=document.getElementById('paneS');
  if(SROWS===null){
    el.innerHTML='<p class="sub">60분봉 누적 원본을 불러오는 중…</p>';
    const raw=await loadRawRows(CODE);
    SROWS=raw||(DATA?DATA.rows.filter(r=>MIN.includes(r.tf)):[]);}
  const r60=sSeries('60m'), r240=sSeries('240m'), r5=sSeries('5m');
  if(!r60){el.innerHTML='<div class="err">이 종목은 60분봉이 없습니다. 관심 25종목만 분봉을 모읍니다.</div>';return;}
  const cy=cyc60(r60), gt=gate240(r240), sp5=r5?split5(r5):null;
  const st5=r5?rowState(r5.K):null, st6=rowState(r60.K);
  const agg = st6.s===2 ? '<span class="tag hot" style="background:#fef3f2;color:#b42318">적극매수 (60분 3형제 동시 20↓)</span>' : '';
  const SP=['분할매수','보유','매도 준비','청산 완료'];
  const steps=SP.map(x=>{
    const done=SP.indexOf(x)<SP.indexOf(cy.stage);
    const on=(x===cy.stage);
    const desc={'분할매수':'60분 큰형 20 이하 — 5분봉 보며 나눠 담기',
                '보유':'60분 큰형 20 위 복귀 — 반등 확인됨',
                '매도 준비':'60분 큰형 80 이상 — 아직 팔지 않는다',
                '청산 완료':'80 위에서 데드크로스 — 매도 시점'}[x];
    return `<div class="step ${on?'on':(done?'done':'')}"><b>${x}</b>${desc}</div>`;}).join('');
  const spanb=SSPANS.map(([m,t])=>`<button class="sm ${m===SMUL?'on':''}" data-smul="${m}">${t}</button>`).join('');
  const pxNow=r60.c[r60.c.length-1];

  el.innerHTML=`
  <div class="verdict ${cy.stage==='분할매수'||cy.stage==='보유'?'buy':(cy.stage==='매도 준비'?'sell':'')}">
    <div class="big">${cy.stage}</div>
    <div class="meta">${NAMES[CODE]||CODE} ${CODE} · ${pxNow!=null?(+pxNow).toLocaleString():'-'} ·
      60분 큰형 ${cy.k==null?'-':cy.k.toFixed(0)} / %D ${cy.d==null?'-':cy.d.toFixed(0)} ${agg}
      <br><span class="gate ${gt.cls}">${gt.txt}</span></div>
  </div>
  <div class="steps">${steps}</div>
  <div class="bar"><span class="sub">구간</span>${spanb}</div>
  ${SSET_HTML()}
  <p class="note">
    <b>이 매매의 목적은 하나입니다 — 60분 큰형이 바닥일 때 사서, 60분 큰형이 80에 올 때 판다.</b>
    그래서 기준봉은 60분봉 하나이고, 화면도 위에서부터 <b>60분(메인) → 5분(분할) → 240분(흐름)</b> 순으로 놓았습니다.<br>
    <b>60분 — 메인.</b> 붉은 세로 띠가 큰형 20 이하입니다. 이 구간이 «바닥 구간»이고,
    띠가 끝나며 큰형이 20 위로 올라서는 자리가 ▲<b>매수</b>(반등 확인)입니다.
    푸른 띠는 큰형 80 이상 — 목표 지점에 왔다는 뜻이지만 여기서 바로 팔지 않습니다.
    80 위에서 %K가 %D를 꺾고 내려오는 ▼<b>청산</b>이 매도 시점입니다.
    실측에서 데드크로스가 사이클 최고가의 78%를 가져갔습니다(+9.63% vs 상한 +12.27%).<br>
    <b>5분 — 분할.</b> 단기 고·저점을 보고 «어디서 얼마나 담을지»만 정합니다. 매수·매도 판정은 하지 않습니다.
    차트 아래 작은 삼각형이 <b>막·둘·큰</b> 각각의 분할 트리거입니다.<br>
    <b>240분 — 흐름.</b> 큰 흐름만 봅니다. 재검증(24종목·무산 포함 1,464 사이클) 결과
    30 미만 38% / 30~70 39% / 70 초과 27%로, <b>낮은 쪽은 차이가 없고 70 초과만 나쁩니다.</b>
    이전에 «30 미만이면 위험»이라고 경고했던 것은 11건짜리 단일 종목 관찰이어서 내렸습니다.<br>
    <b>계산식은 HTS 정식</b>입니다 — Σ(종가−최저)/Σ(최고−최저), %D는 지수이동평균.
    사장님 HTS 내보내기 900봉과 오차 0으로 맞췄습니다.<br>
    ⚠ 분할 회차·비중과 손절선은 아직 정하지 않았습니다. 진입 전 최저는 24종목 평균 −3.2%,
    최악 −28.5%(반도체레버리지 단일 종목은 −8.7%~−30.4%)였습니다. 손절 −8%는 성공 사이클까지 자릅니다.<br>
    ⚠ 5분 분할이 성적을 개선하는지는 아직 검증되지 않았습니다 — 5분봉 보유량이 60거래일뿐이어서
    검증 숫자는 전부 «60분 단일 진입» 기준입니다.
  </p>`;
  el.querySelectorAll('[data-smul]').forEach(b=>b.onclick=()=>{SMUL=+b.dataset.smul;renderS();});
  for(const [tf,cid] of SORD){
    const rr=sSeries(tf); if(!rr)continue;
    drawSet(tf,cid,rr,cy,sp5);}
}
function SSET_HTML(){
  return SORD.map(([tf,cid])=>{
    const rr=sSeries(tf);
    const [role,desc]=SROLE[tf];
    if(!rr)return `<div class="shead"><span><b>${LBL[tf]}</b> <span class="role">${role}</span></span></div>
      <div class="sbox" style="height:60px;display:flex;align-items:center;justify-content:center;color:#9aa0a6;font-size:12px">데이터 없음</div>`;
    const st=rowState(rr.K);
    return `<div class="shead"><span><b>${LBL[tf]}봉</b> <span class="role">${role}</span> <span class="sub">${desc}</span></span>
      <span class="sub">막내 ${fk(rr.K.k5.k[rr.K.k5.k.length-1])} · 둘째 ${fk(rr.K.k10.k[rr.K.k10.k.length-1])} · 큰형 ${fk(rr.K.k20.k[rr.K.k20.k.length-1])}
      · ${st.lack?'-':SN[st.s]}</span></div>
      <div class="sbox"><canvas id="${cid}"></canvas></div>`;}).join('');
}

async function go(){
  document.getElementById('vd').innerHTML='<p class="sub">불러오는 중…</p>';
  VROWS=null;
  try{
    DATA=await loadOne(CODE);POS=1e9;
    const hasMin=DATA.rows.some(r=>MIN.includes(r.tf));
    if(!hasMin){TF='D';
      document.getElementById('nomin').innerHTML=
        '<span class="tag">분봉 없음 — 관심 20종목만 분봉을 모읍니다. 이 종목은 일·주·월봉만 나옵니다.</span>';}
    else{document.getElementById('nomin').innerHTML='';
      if(!DATA.rows.some(r=>r.tf===TF))TF='60m';}
    render();
    SROWS=null;
    if(TAB==='V')renderV();
    if(TAB==='S')renderS();
  }catch(e){document.getElementById('vd').innerHTML='<div class="err">오류: '+e.message+'</div>';}
}
(async function(){
  let ALL=[];
  try{const idx=await fetch('../stoch/data/index.json').then(r=>r.json());
    ALL=(idx.tickers||[]).filter(t=>t.market!=='INDEX');
    ALL.forEach(t=>NAMES[t.code]=t.name);}catch(e){}
  try{WL=await fetch('../stoch/watchlist.json').then(r=>r.json());}catch(e){WL=[];}
  const sel=document.getElementById('sel');
  sel.innerHTML='<option value="">관심 20종목</option>'
    +WL.map(c=>`<option value="${c}">${NAMES[c]||c} (${c})</option>`).join('');
  document.getElementById('tk').innerHTML=
    ALL.map(t=>`<option value="${t.name} (${t.code})">`).join('');
  const qs=new URLSearchParams(location.search).get('code');
  CODE=(qs&&/^\d{6}$/.test(qs))?qs:(WL[0]||'005930');
  const qi=document.getElementById('q');
  const setCode=c=>{if(!c||c===CODE)return;CODE=c;qi.value=(NAMES[c]||'')+' ('+c+')';
    sel.value=WL.includes(c)?c:'';history.replaceState(null,'','?code='+c);go();};
  qi.value=(NAMES[CODE]||'')+' ('+CODE+')';
  sel.value=WL.includes(CODE)?CODE:'';
  const pick=()=>{const v=qi.value.trim();if(!v)return;
    let m=v.match(/(\d{6})/);
    if(!m){const hit=ALL.find(t=>t.name===v)||ALL.find(t=>t.name.startsWith(v))
             ||ALL.find(t=>t.name.indexOf(v)>=0);
      if(hit)m=[0,hit.code];}
    if(m)setCode(m[1]);};
  qi.onchange=pick;
  qi.onkeydown=e=>{if(e.key==='Enter')pick();};
  sel.onchange=()=>{if(sel.value)setCode(sel.value);};
  document.getElementById('tabS').onclick=()=>showTab('S');
  document.getElementById('tabT').onclick=()=>showTab('T');
  document.getElementById('tabV').onclick=()=>showTab('V');
  document.getElementById('cut').onchange=e=>{CUT=+e.target.value;render();};
  document.getElementById('tr').onchange=e=>{TRN=+e.target.value;render();};
  document.getElementById('sc').oninput=e=>{POS=+e.target.value;render();};
  document.getElementById('prev').onclick=()=>{POS=Math.max(0,POS-Math.round(SPAN/3||20));render();};
  document.getElementById('next').onclick=()=>{POS=POS+Math.round(SPAN/3||20);render();};
  go();
})();
</script>
