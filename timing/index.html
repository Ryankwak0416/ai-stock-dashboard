<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>스토캐스틱 주관 매수매도 타이밍</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<style>
:root{--bg:#ffffff;--pan:#f7f8fa;--fg:#1a1a1a;--sub:#6b7280;--line:#e3e5e8;
  --buy:#d92d20;--buyd:#fef3f2;--sell:#1849a9;--selld:#eff6ff;--neu:#9aa0a6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:18px 14px 70px}
h1{font-size:19px;margin:0 0 2px}
.sub{color:var(--sub);font-size:12px} p.sub{margin:0 0 16px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
select,button{font:inherit;padding:5px 11px;border:1px solid var(--line);border-radius:999px;
  background:#fff;color:var(--fg);cursor:pointer}
select{border-radius:8px}
button.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a;font-weight:600}
button.sm{padding:3px 9px;font-size:12px}
.verdict{border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:14px;background:var(--pan)}
.verdict .big{font-size:25px;font-weight:700;letter-spacing:-.5px}
.verdict .meta{font-size:12px;color:var(--sub);margin-top:3px}
.verdict.buy{border-color:var(--buy);background:var(--buyd)} .verdict.buy .big{color:var(--buy)}
.verdict.sell{border-color:var(--sell);background:var(--selld)} .verdict.sell .big{color:var(--sell)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:18px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:11px;color:var(--sub);font-weight:600;border-bottom:2px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td.st{text-align:center;font-weight:600}
tr.sel{background:#eef2f7}
tr.pick{cursor:pointer}
tr.pick:hover{background:#f4f6f9}
.c2{background:var(--buy);color:#fff}.c1{color:var(--buy)}
tr.avg td{background:#f2f4f7;font-weight:600}
tr.avg{border-top:2px solid #cbd2d9}
.c0{color:var(--neu)}.cm1{color:var(--sell)}.cm2{background:var(--sell);color:#fff}
.lo{color:var(--buy);font-weight:600}.hi{color:var(--sell);font-weight:600}
.role{display:inline-block;font-size:10px;padding:1px 6px;border-radius:999px;background:#1a1a1a;color:#fff;margin-left:5px;vertical-align:1px}
.tag{display:inline-block;font-size:10px;padding:0 5px;border-radius:3px;background:#eef0f3;color:var(--sub);margin-left:3px}
.tag.cv{background:#fef3c7;color:#92400e}
.cbox{position:relative;height:340px;background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:8px}
.scrollrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.scrollrow input[type=range]{flex:1;accent-color:#1849a9}
.info{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;margin-top:4px}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin:8px 0 4px}
.lg i{display:inline-block;width:18px;height:2px;vertical-align:middle;margin-right:4px}
.note{font-size:12px;color:var(--sub);margin-top:20px;line-height:1.8}
.note b{color:var(--fg)}
.err{padding:18px;background:#fff8e6;border:1px solid #f0c36d;border-radius:8px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<h1>스토캐스틱 주관 매수매도 타이밍</h1>
<p class="sub">막내(5,3) · 둘째(10,6) · 큰형(20,12) — 1분봉부터 월봉까지 같은 방식으로 판정합니다.</p>

<div class="bar">
  <select id="sel"></select>
  <span class="sub">컷</span>
  <select id="cut"><option value="20">20 / 80</option><option value="15">15 / 85</option><option value="25">25 / 75</option><option value="30">30 / 70</option></select>
  <span class="sub">추세</span>
  <select id="tr"><option value="3">3봉 전 대비</option><option value="1">1봉 전</option><option value="5">5봉 전</option></select>
</div>

<div id="vd"></div>
<div id="tbl"></div>

<div class="bar" id="tfbar"></div>
<div class="bar" id="spanbar"></div>
<div class="cbox"><canvas id="cv"></canvas></div>
<div class="scrollrow"><button class="sm" id="prev">◀</button><input type="range" id="sc" min="0" max="0" value="0"><button class="sm" id="next">▶</button></div>
<div class="info"><span id="d0">-</span><span id="mid">-</span><span id="d1">-</span></div>
<div class="lg">
  <span><i style="background:#111;height:3px"></i>종가</span>
  <span><i style="background:#e03131"></i>막내 5·3·3</span>
  <span><i style="background:#2f9e44"></i>둘째 10·6·6</span>
  <span><i style="background:#1971c2"></i>큰형 20·12·12</span>
  <span>▲ 적극매수 성립(3형제 동시 과매도) · ▼ 적극매도 성립(동시 과매수)</span>
  <span>바탕색 = 이평 배열(붉은 정배열 · 푸른 역배열) · 아래 갈색칸 = 이평 수렴중</span>
</div>

<p class="note" id="foot"></p>
</div>
<script>
const MIN=['1m','5m','10m','30m','60m','120m','240m'];
const LBL={'1m':'1분','5m':'5분','10m':'10분','30m':'30분','60m':'60분','120m':'120분','240m':'240분','D':'일봉','W':'주봉','M':'월봉'};
const SUPER=['5m','60m','240m'];
const ROLE={'5m':'단타','60m':'스윙','240m':'추세'};
const RTAG=tf=>ROLE[tf]?`<span class="role">${ROLE[tf]}</span>`:'';
const SPANS=[[60,'60봉'],[120,'120봉'],[250,'250봉'],[0,'전체']];
let CUT=20,TRN=3,CODE=null,TF='60m',SPAN=120,POS=1e9,NAMES={},WL=[],DATA=null,chart=null;
let SHOW={px:true,k5:true,k10:true,k20:true};
const SPANOPT=[30,40,60,80,100,120,160,200,250,300,0];

function sma(a,n){const o=Array(a.length).fill(null);let s=0,c=0;
  for(let i=0;i<a.length;i++){const v=a[i];
    if(v==null){s=0;c=0;o[i]=null;continue;}
    s+=v;c++;if(c>n){s-=a[i-n];c=n;}o[i]=c>=n?s/n:null;}return o;}
function slowStoch(h,l,c,n,sl,dp){
  const fk=Array(c.length).fill(null);
  for(let i=n-1;i<c.length;i++){let hh=-1e18,ll=1e18;
    for(let j=i-n+1;j<=i;j++){if(h[j]>hh)hh=h[j];if(l[j]<ll)ll=l[j];}
    fk[i]=(hh===ll)?null:(c[i]-ll)/(hh-ll)*100;}
  const k=sma(fk,sl);return {k,d:sma(k,dp)};}
function trio(h,l,c){return {k5:slowStoch(h,l,c,5,3,3),k10:slowStoch(h,l,c,10,6,6),k20:slowStoch(h,l,c,20,12,12)};}
function regroup(dates,h,l,c,mode){
  const H=[],L=[],C=[],T=[];let key=null;
  const kf=mode==='W'?d=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()-((x.getUTCDay()+6)%7));return x.toISOString().slice(0,10);}:d=>d.slice(0,7);
  for(let i=0;i<dates.length;i++){const k=kf(dates[i]);
    if(k!==key){key=k;T.push(dates[i]);H.push(h[i]);L.push(l[i]);C.push(c[i]);}
    else{const j=H.length-1;if(h[i]>H[j])H[j]=h[i];if(l[i]<L[j])L[j]=l[i];C[j]=c[i];}}
  return {t:T,h:H,l:L,c:C};}
function lastVal(a){for(let i=a.length-1;i>=0;i--)if(a[i]!=null)return a[i];return null;}
function stateAt(K,i){
  const v=[K.k5.k[i],K.k10.k[i],K.k20.k[i]];
  if(v.some(x=>x==null))return {s:0,v,lack:true};
  if(v.every(x=>x<=CUT))return {s:2,v};
  if(v.every(x=>x>=100-CUT))return {s:-2,v};
  const r=a=>{const p=a[i-TRN];return (p==null)?0:(a[i]>p?1:(a[i]<p?-1:0));};
  const d=[r(K.k5.k),r(K.k10.k),r(K.k20.k)];
  const up=d.filter(x=>x>0).length,dn=d.filter(x=>x<0).length;
  return {s:up>=2?1:(dn>=2?-1:0),v};}
function rowState(K){return stateAt(K,K.k5.k.length-1);}
function baseCount(a,w){const n=a.length,st=Math.max(1,n-w);let c=0;
  for(let i=st;i<n;i++)if(a[i]!=null&&a[i-1]!=null&&a[i]<=CUT&&a[i-1]>CUT)c++;return c;}
// 이평 5·10·20·60 상태. a: 1 정배열 / -1 역배열 / 0 중립, cv: 수렴중
// 수렴 판정은 고정 퍼센트가 아니라 그 봉의 변동성 대비다.
// (5분봉에 맞춘 0.4% 고정값은 60·240분봉에서 사실상 한 번도 걸리지 않았다)
const CVR=2.0;   // 이평 폭 / 최근 20봉 평균 변동폭
function maCalc(c,i){
  const m=[5,10,20,60].map(p=>{if(i+1<p)return null;let s=0;for(let j=i-p+1;j<=i;j++)s+=c[j];return s/p;});
  if(m[2]==null||m[3]==null)return{a:0,cv:false};
  const px=c[i];
  // 배열은 20·60 두 선의 위아래만 본다. 가격 위치까지 걸면 잔파동에 「중립」이 절반 가까이 나와
  // 분봉 칸이 계속 「—」로 비어 보인다.
  const a=(m[2]>m[3])?1:((m[2]<m[3])?-1:0);
  let cv=false;
  if(i>=20){let v=0;for(let j=i-19;j<=i;j++)v+=Math.abs(c[j]-c[j-1])/c[j];v/=20;
    if(v>0)cv=((Math.max(...m)-Math.min(...m))/px)/v<CVR;}
  return{a,cv};}
function maAt(c,i){const s=maCalc(c,i);return s.cv?2:s.a;}
function maState(c){return maCalc(c,c.length-1);}
function toEpoch(s){return Math.floor(new Date(s+'T15:30:00+09:00').getTime()/1000);}
function fmtT(t){if(t==null)return '-';
  if(typeof t==='number'){const d=new Date(t*1000),p=n=>String(n).padStart(2,'0');
    return `${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
  return String(t).slice(2);}

async function loadOne(code){
  const [mn,dl]=await Promise.all([
    fetch(`../stoch/min/${code}.json?t=${Date.now()}`).then(r=>r.ok?r.json():null).catch(()=>null),
    fetch(`../stoch/data/${code}.json?t=${Date.now()}`).then(r=>r.ok?r.json():null).catch(()=>null)]);
  const rows=[];
  if(mn&&mn.sig)for(const tf of MIN){const s=mn.sig[tf];if(!s)continue;
    rows.push({tf,label:LBL[tf],ts:s.t,c:s.c,
      K:{k5:{k:s.k5k,d:s.k5d},k10:{k:s.k10k,d:s.k10d},k20:{k:s.k20k,d:s.k20d}}});}
  if(dl&&dl.close)for(const md of ['D','W','M']){
    const g=md==='D'?{t:dl.dates,h:dl.high,l:dl.low,c:dl.close}:regroup(dl.dates,dl.high,dl.low,dl.close,md);
    rows.push({tf:md,label:LBL[md],ts:g.t,c:g.c,K:trio(g.h,g.l,g.c)});}
  return {mn,dl,rows};}

const SN={2:'적극매수',1:'상승추세',0:'중립','-1':'하락추세','-2':'적극매도'};
const SC={2:'c2',1:'c1',0:'c0','-1':'cm1','-2':'cm2'};
const fk=x=>x==null?'-':Math.round(x);
const kc=x=>x==null?'<span class="c0">-</span>':(x<=CUT?`<span class="lo">${Math.round(x)}</span>`:(x>=100-CUT?`<span class="hi">${Math.round(x)}</span>`:Math.round(x)));

function head(){
  const data=DATA,st={};data.rows.forEach(r=>st[r.tf]=rowState(r.K));
  const SV=Object.values(st).filter(x=>!x.lack);
  const nB=SV.filter(x=>x.s>0).length,nSB=SV.filter(x=>x.s===2).length;
  const nS=SV.filter(x=>x.s<0).length,nSS=SV.filter(x=>x.s===-2).length,tot=SV.length;
  const sup=SUPER.every(tf=>st[tf]&&st[tf].s===2),supS=SUPER.every(tf=>st[tf]&&st[tf].s===-2);
  let vc='',vt,vs;
  if(sup){vc='buy';vt='★ 수퍼매수 타이밍';vs='5분·60분·240분봉이 동시에 적극매수입니다.';}
  else if(supS){vc='sell';vt='★ 수퍼매도 타이밍';vs='5분·60분·240분봉이 동시에 적극매도입니다.';}
  else if(nSB>=3){vc='buy';vt='적극매수 우세';vs=tot+'칸 중 '+nSB+'칸이 적극매수입니다.';}
  else if(nSS>=3){vc='sell';vt='적극매도 우세';vs=tot+'칸 중 '+nSS+'칸이 적극매도입니다.';}
  else if(nB>nS){vc='buy';vt='매수 우위';vs='적극매수 칸은 적습니다. 상승추세 위주입니다.';}
  else if(nS>nB){vc='sell';vt='매도 우위';vs='적극매도 칸은 적습니다. 하락추세 위주입니다.';}
  else{vt='중립';vs='어느 쪽으로도 기울지 않았습니다.';}
  const px=data.rows[0].c[data.rows[0].c.length-1];
  document.getElementById('vd').innerHTML=
    `<div class="verdict ${vc}"><div class="big">${vt}</div><div class="meta">${data.dl?data.dl.name:CODE} ${CODE} · `
    +`${px!=null?(+px).toLocaleString():'-'} · ${tot}칸 중 <b>매수 ${nB}</b>(적극 ${nSB}) / <b>매도 ${nS}</b>(적극 ${nSS}) · ${vs}</div></div>`;

  const mR=data.rows.filter(r=>MIN.includes(r.tf)),mOK=mR.filter(r=>!st[r.tf].lack);
  const mAvg=mOK.length?mOK.reduce((x,r)=>x+st[r.tf].s,0)/mOK.length:null;
  const aS=mAvg==null?0:(mAvg>=1.5?2:mAvg>=.5?1:mAvg<=-1.5?-2:mAvg<=-.5?-1:0);
  const rowHtml=r=>{
    const s=st[r.tf],ma=maState(r.c),bc=baseCount(r.K.k5.k,60);
    return `<tr class="pick ${r.tf===TF?'sel':''}" data-tf="${r.tf}">
      <td><b>${r.label}</b>${RTAG(r.tf)}</td>
      <td class="st ${SC[s.s]}">${s.lack?'<span class="c0">데이터 부족</span>':SN[s.s]}</td>
      <td>${kc(s.v[0])}</td><td>${kc(s.v[1])}</td><td>${kc(s.v[2])}</td>
      <td>${ma.a===1?'<span class="lo">정배열</span>':ma.a===-1?'<span class="hi">역배열</span>':'<span class="c0">—</span>'}${ma.cv?'<span class="tag cv">수렴중</span>':''}</td>
      <td>${bc}</td><td class="sub">${fmtT(r.ts[r.ts.length-1])}</td></tr>`;};
  const avgHtml=`<tr class="avg"><td><b>분봉 평균</b></td><td class="st ${SC[aS]}">${SN[aS]}</td>
    <td colspan="5" style="text-align:left" class="sub">1분~240분 7개 봉의 평균 ${mAvg==null?'-':mAvg.toFixed(2)}
      (적극매수 +2 / 상승추세 +1 / 중립 0 / 하락추세 −1 / 적극매도 −2)</td><td></td></tr>`;
  const body=mR.map(rowHtml).join('')+avgHtml
    +data.rows.filter(r=>['D','W','M'].includes(r.tf)).map(rowHtml).join('');
  document.getElementById('tbl').innerHTML=
    `<table><thead><tr><th>봉</th><th style="text-align:center">상태</th><th>막내</th><th>둘째</th><th>큰형</th>
     <th style="text-align:left">이평 20·60</th><th>다지기</th><th style="text-align:left">최근봉</th></tr></thead><tbody>${body}</tbody></table>`;
  document.querySelectorAll('[data-tf]').forEach(el=>el.onclick=()=>{TF=el.dataset.tf;POS=1e9;render();});
}

function render(){
  const data=DATA;
  if(!data||!data.rows.length){document.getElementById('vd').innerHTML='<div class="err">이 종목의 분봉 데이터가 아직 없습니다.</div>';return;}
  if(!data.rows.some(r=>r.tf===TF))TF=data.rows[0].tf;
  head();
  document.getElementById('tfbar').innerHTML='<span class="sub">차트 봉</span>'+
    data.rows.map(r=>`<button class="sm ${r.tf===TF?'on':''}" data-ctf="${r.tf}">${r.label}${ROLE[r.tf]?' · '+ROLE[r.tf]:''}</button>`).join('');
  const si=Math.max(0,SPANOPT.indexOf(SPAN));
  document.getElementById('spanbar').innerHTML=
    '<span class="sub">구간 폭</span><input type="range" id="sp" min="0" max="'+(SPANOPT.length-1)+'" value="'+si+'" style="width:190px;accent-color:#1849a9">'
   +'<span class="sub" id="spl" style="min-width:52px">'+(SPAN===0?'전체':SPAN+'봉')+'</span>'
   +'<span style="width:14px"></span><span class="sub">표시</span>'
   +[['px','가격','#111827'],['k5','막내 5·3·3','#e03131'],['k10','둘째 10·6·6','#2f9e44'],['k20','큰형 20·12·12','#1971c2']]
     .map(o=>`<button class="sm ${SHOW[o[0]]?'on':''}" data-sh="${o[0]}" style="border-color:${o[2]};${SHOW[o[0]]?'':'color:'+o[2]}">${o[1]}</button>`).join('');
  const spEl=document.getElementById('sp');
  spEl.oninput=e=>{SPAN=SPANOPT[+e.target.value];POS=1e9;render();};
  document.querySelectorAll('[data-ctf]').forEach(b=>b.onclick=()=>{TF=b.dataset.ctf;POS=1e9;render();});
  document.querySelectorAll('[data-sh]').forEach(b=>b.onclick=()=>{SHOW[b.dataset.sh]=!SHOW[b.dataset.sh];render();});

  const r=data.rows.find(x=>x.tf===TF),N=r.c.length;
  const span=(SPAN<=0||SPAN>=N)?N:SPAN;
  POS=Math.max(0,Math.min(POS,N-span));
  const a=POS,b=a+span-1;
  const sc=document.getElementById('sc');sc.max=Math.max(0,N-span);sc.value=POS;sc.disabled=(span>=N);

  const BUY=[],SELL=[];
  for(let i=0;i<N;i++){const q=stateAt(r.K,i),p=i?stateAt(r.K,i-1):{s:0};
    if(!q.lack&&q.s===2&&p.s!==2)BUY.push(i);
    if(!q.lack&&q.s===-2&&p.s!==-2)SELL.push(i);}
  const MAA=new Array(N).fill(0),MAC=new Array(N).fill(false);
  for(let i=Math.max(0,a-1);i<=b&&i<N;i++){const m=maCalc(r.c,i);MAA[i]=m.a;MAC[i]=m.cv;}

  const labels=[],px=[],k5=[],k10=[],k20=[];
  for(let i=a;i<=b;i++){labels.push(fmtT(r.ts[i]));px.push(r.c[i]);
    k5.push(r.K.k5.k[i]);k10.push(r.K.k10.k[i]);k20.push(r.K.k20.k[i]);}
  const line=(d,col,w,ax)=>({data:d,borderColor:col,borderWidth:w,pointRadius:0,tension:.25,yAxisID:ax,order:3});
  const ds=[];const NM=[];
  if(SHOW.px){ds.push(line(px,'#111827',2.8,'y'));NM.push('종가');}
  if(SHOW.k5){ds.push(line(k5,'#e03131',1,'y2'));NM.push('막내');}
  if(SHOW.k10){ds.push(line(k10,'#2f9e44',1,'y2'));NM.push('둘째');}
  if(SHOW.k20){ds.push(line(k20,'#1971c2',1.3,'y2'));NM.push('큰형');}
  ds.push({data:labels.map(()=>CUT),borderColor:'rgba(217,45,32,.5)',borderWidth:1,borderDash:[5,4],pointRadius:0,yAxisID:'y2',order:4});
  ds.push({data:labels.map(()=>100-CUT),borderColor:'rgba(24,73,169,.5)',borderWidth:1,borderDash:[5,4],pointRadius:0,yAxisID:'y2',order:4});

  const tap={id:'tap',beforeDatasetsDraw(ch){
    const ca=ch.chartArea,xs=ch.scales.x;if(!ca||!xs)return;const g=ch.ctx;
    // 배경 채움 = 이평 배열. 붉은 바탕 정배열 / 푸른 바탕 역배열 (매수·매도 타점은 화살표로만)
    let i0=a;
    while(i0<=b){const v=MAA[i0];let j=i0;
      while(j+1<=b&&MAA[j+1]===v)j++;
      if(v){const x1=xs.getPixelForValue(i0-a),x2=(j<b)?xs.getPixelForValue(j+1-a):xs.getPixelForValue(j-a)+2;
        g.save();g.fillStyle=(v>0)?'rgba(217,45,32,.10)':'rgba(24,73,169,.10)';
        g.fillRect(x1,ca.top,Math.max(2,x2-x1),ca.bottom-ca.top);g.restore();}
      i0=j+1;}
    // 수렴중 띠 (차트 하단)
    const SB=9, by0=ca.bottom-SB;
    for(let i=a;i<=b;i++){if(!MAC[i])continue;
      const x1=xs.getPixelForValue(i-a),x2=(i<b)?xs.getPixelForValue(i+1-a):x1+2;
      g.save();g.fillStyle='rgba(180,83,9,.55)';
      g.fillRect(x1,by0,Math.max(1.5,x2-x1),SB);g.restore();}
    g.save();g.font='10px -apple-system,Malgun Gothic,sans-serif';g.fillStyle='#6b7280';
    g.textAlign='left';g.fillText('바탕 붉은색 정배열 / 푸른색 역배열   ·   아래 갈색칸 이평 수렴중',ca.left+3,by0-3);g.restore();
    const mark=(list,ln,fl,dir,tx)=>{list.forEach(i=>{if(i<a||i>b)return;const x=xs.getPixelForValue(i-a);
      g.save();g.strokeStyle=ln;g.lineWidth=1.3;g.setLineDash([5,4]);
      g.beginPath();g.moveTo(x,ca.top);g.lineTo(x,ca.bottom);g.stroke();g.setLineDash([]);
      g.fillStyle=fl;g.beginPath();
      if(dir>0){g.moveTo(x,by0-6);g.lineTo(x-8,by0-22);g.lineTo(x+8,by0-22);}
      else{g.moveTo(x,ca.top+4);g.lineTo(x-8,ca.top+20);g.lineTo(x+8,ca.top+20);}
      g.closePath();g.fill();
      g.strokeStyle='#fff';g.lineWidth=1.5;g.stroke();
      // 화살표 옆 글자
      g.font='bold 11px -apple-system,Malgun Gothic,sans-serif';g.textAlign='center';
      const ty=(dir>0)?by0-26:ca.top+33;
      const w=g.measureText(tx).width+8;
      g.fillStyle='rgba(255,255,255,.85)';g.fillRect(x-w/2,ty-11,w,14);
      g.fillStyle=fl;g.fillText(tx,x,ty);
      g.restore();});};
    mark(BUY,'rgba(217,45,32,.6)','#d92d20',1,'적극매수');
    mark(SELL,'rgba(24,73,169,.6)','#1849a9',-1,'적극매도');}};

  if(chart)chart.destroy();
  chart=new Chart(document.getElementById('cv'),{type:'line',data:{labels,datasets:ds},plugins:[tap],
    options:{responsive:true,maintainAspectRatio:false,animation:false,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>NM[c.datasetIndex]?
        NM[c.datasetIndex]+' '+(c.parsed.y==null?'-':Math.round(c.parsed.y*10)/10):null}}},
      scales:{x:{ticks:{color:'#6b7280',maxTicksLimit:8,font:{size:10}},grid:{color:'#eceef1'}},
        y:{position:'left',ticks:{color:'#6b7280',font:{size:10}},grid:{color:'#eceef1'}},
        y2:{position:'right',min:0,max:100,ticks:{color:'#6b7280',stepSize:20,font:{size:10}},grid:{display:false}}}}});

  document.getElementById('d0').textContent=fmtT(r.ts[a]);
  document.getElementById('d1').textContent=fmtT(r.ts[b]);
  document.getElementById('mid').textContent=`${LBL[TF]} · 폭 ${span}봉 / 전체 ${N}봉 · 이 구간 ▲${BUY.filter(i=>i>=a&&i<=b).length} ▼${SELL.filter(i=>i>=a&&i<=b).length}`;

  document.getElementById('foot').innerHTML=
    `<b>적극매수</b> = 3형제 %K가 모두 ${CUT} 이하 · <b>적극매도</b> = 모두 ${100-CUT} 이상 · `
   +`<b>상승추세</b> = 셋 중 둘 이상이 ${TRN}봉 전보다 높음. 적극과 추세는 섞지 않고 개수도 따로 셉니다.<br>`
   +'차트의 <b>▲▼가 조건이 새로 성립한 자리</b>이고, <b>세로 색 띠는 조건이 유지되는 구간 전체</b>입니다. '
   +'3형제 동시 과매도면 붉은 띠, 동시 과매수면 푸른 띠입니다. '
   +'차트 맨 아래 가로 띠는 봉마다의 <b>이평 20·60 배열</b>이라, 신호가 정배열 구간에서 났는지 역배열 구간에서 났는지 바로 보입니다.<br>'
   +'<b>봉 주기별 쓰임</b> — <b>5분봉 = 단타</b>, <b>60분봉 = 스윙</b>(사흘~2주), <b>240분봉 = 추세</b>(며칠~몇 주). '
   +'스윙이면 60분봉에서 타점을 잡되 일봉이 어느 쪽인지 반드시 같이 보십시오.<br>'
   +'<b>★ 수퍼매수</b> = 5분·60분·240분봉 동시 적극매수. 간격을 크게 벌린 셋이라 서로 다른 시간대를 확인합니다.<br>'
   +`<b>다지기</b> = 최근 60봉에서 막내 %K가 ${CUT} 아래로 새로 내려간 횟수. 많이 다질수록 확률이 올라가되, `
   +'그동안 가격이 저점을 낮추지 않았어야 응축입니다. <b>이평</b> 정배열이면 신뢰도가 올라가고 역배열이면 내려갑니다.<br>'
   +'· 야후 분봉이 14:55까지만 주는 구간은 <b>네이버 1분봉으로 15:30까지 메웁니다</b>(그 구간 고·저가는 1분 종가의 최대·최소). '
   +'1분봉은 8일치부터 시작해 매일 쌓입니다.<br>'
   +'⚠ 월봉 큰형(20,12)은 일봉 500봉으로는 기간이 모자라 «데이터 부족»입니다.<br>'
   +'⚠ <b>아직 백테스트로 검증하지 않은 화면입니다.</b> 갱신 '
   +(DATA.mn&&DATA.mn.updated?DATA.mn.updated.replace('T',' ').slice(0,16)+' UTC':'-');
}

async function go(){
  document.getElementById('vd').innerHTML='<p class="sub">불러오는 중…</p>';
  try{DATA=await loadOne(CODE);POS=1e9;render();}
  catch(e){document.getElementById('vd').innerHTML='<div class="err">오류: '+e.message+'</div>';}
}
(async function(){
  try{const idx=await fetch('../stoch/data/index.json').then(r=>r.json());
    (idx.tickers||[]).forEach(t=>NAMES[t.code]=t.name);}catch(e){}
  try{WL=await fetch('../stoch/watchlist.json').then(r=>r.json());}catch(e){WL=[];}
  const sel=document.getElementById('sel');
  sel.innerHTML=WL.map(c=>`<option value="${c}">${NAMES[c]||c} (${c})</option>`).join('');
  const q=new URLSearchParams(location.search).get('code');
  CODE=(q&&WL.includes(q))?q:(WL[0]||'005930');
  sel.value=CODE;
  sel.onchange=()=>{CODE=sel.value;go();};
  document.getElementById('cut').onchange=e=>{CUT=+e.target.value;render();};
  document.getElementById('tr').onchange=e=>{TRN=+e.target.value;render();};
  document.getElementById('sc').oninput=e=>{POS=+e.target.value;render();};
  document.getElementById('prev').onclick=()=>{POS=Math.max(0,POS-Math.round(SPAN/3||20));render();};
  document.getElementById('next').onclick=()=>{POS=POS+Math.round(SPAN/3||20);render();};
  go();
})();
</script>
</body>
</html>
