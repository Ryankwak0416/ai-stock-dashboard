<script>
const MIN=['1m','3m','5m','10m','30m','60m','120m','240m'];
const LBL={'1m':'1분','3m':'3분','5m':'5분','10m':'10분','30m':'30분','60m':'60분','120m':'120분','240m':'240분','D':'일봉','W':'주봉','M':'월봉'};
const SUPER=['5m','60m','240m'];
const ROLE={'5m':'단타','60m':'스윙','240m':'추세'};
const RTAG=tf=>ROLE[tf]?`<span class="role">${ROLE[tf]}</span>`:'';
const SPANS=[[60,'60봉'],[120,'120봉'],[250,'250봉'],[0,'전체']];
let CUT=20,TRN=3,CODE=null,TF='60m',SPAN=120,POS=1e9,NAMES={},WL=[],DATA=null,chart=null;
let SHOW={px:true,k5:true,k10:true,k20:true};
const SPANOPT=[30,40,60,80,100,120,160,200,250,300,0];

function sma(a,n){const o=Array(a.length).fill(null);let s=0,c=0;
  for(let i=0;i<a.length;i++){const v=a[i];
    if(v==null){s=0;c=0;o[i]=null;continue;}
    s+=v;c++;if(c>n){s-=a[i-n];c=n;}o[i]=c>=n?s/n:null;}return o;}
// Slow %K / %D — HTS 정식.
// 사장님 HTS가 내보낸 60분봉 900봉으로 역산해 오차 0.0000으로 맞춘 식이다(2026-09-17).
//   %K = Σ(종가 − n기간최저) / Σ(n기간최고 − n기간최저) × 100   (슬로잉 기간 합산)
//   %D = %K의 지수이동평균(EMA, α = 2/(dp+1))
// 이전에 쓰던 SMA(Fast %K) 방식은 최대 22포인트까지 벌어져 20/80 판정이 달라졌다.
function slowStoch(h,l,c,n,sl,dp){
  const N=c.length, hi=Array(N).fill(null), lo=Array(N).fill(null);
  for(let i=n-1;i<N;i++){let hh=-1e18,ll=1e18;
    for(let j=i-n+1;j<=i;j++){if(h[j]>hh)hh=h[j];if(l[j]<ll)ll=l[j];}
    hi[i]=hh;lo[i]=ll;}
  const k=Array(N).fill(null);
  for(let i=n+sl-2;i<N;i++){let num=0,den=0,ok=true;
    for(let j=i-sl+1;j<=i;j++){
      if(hi[j]==null){ok=false;break;}
      num+=c[j]-lo[j];den+=hi[j]-lo[j];}
    if(ok&&den>0)k[i]=num/den*100;}
  const d=Array(N).fill(null),a=2/(dp+1);let p=null;
  for(let i=0;i<N;i++){if(k[i]==null)continue;
    p=(p==null)?k[i]:p+a*(k[i]-p);d[i]=p;}
  return {k,d};}
function trio(h,l,c){return {k5:slowStoch(h,l,c,5,3,3),k10:slowStoch(h,l,c,10,6,6),k20:slowStoch(h,l,c,20,12,12)};}
function regroup(dates,h,l,c,mode){
  const H=[],L=[],C=[],T=[];let key=null;
  const kf=mode==='W'?d=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()-((x.getUTCDay()+6)%7));return x.toISOString().slice(0,10);}:d=>d.slice(0,7);
  for(let i=0;i<dates.length;i++){const k=kf(dates[i]);
    if(k!==key){key=k;T.push(dates[i]);H.push(h[i]);L.push(l[i]);C.push(c[i]);}
    else{const j=H.length-1;if(h[i]>H[j])H[j]=h[i];if(l[i]<L[j])L[j]=l[i];C[j]=c[i];}}
  return {t:T,h:H,l:L,c:C};}
function lastVal(a){for(let i=a.length-1;i>=0;i--)if(a[i]!=null)return a[i];return null;}
function stateAt(K,i){
  const v=[K.k5.k[i],K.k10.k[i],K.k20.k[i]];
  if(v.some(x=>x==null))return {s:0,v,lack:true};
  if(v.every(x=>x<=CUT))return {s:2,v};
  if(v.every(x=>x>=100-CUT))return {s:-2,v};
  const r=a=>{const p=a[i-TRN];return (p==null)?0:(a[i]>p?1:(a[i]<p?-1:0));};
  const d=[r(K.k5.k),r(K.k10.k),r(K.k20.k)];
  const up=d.filter(x=>x>0).length,dn=d.filter(x=>x<0).length;
  return {s:up>=2?1:(dn>=2?-1:0),v};}
function rowState(K){return stateAt(K,K.k5.k.length-1);}
// ── 3형제 매수 규칙 (2026-09-18 대표 지시, 계획서 _계획_260918_매수규칙_막내점선_결과표.md §2) ──
// 막내가 바닥(FLOOR 이하 저점)을 찍고, 그 뒤 둘째가 바닥을 찍고, 둘 다 저점보다 RISE 이상 올라 아직 오르는 중일 때
// 큰형이 어느 높이에 있든 %D를 위로 뚫으며(골든크로스) 한 봉에 TURN 이상 솟으면 그 봉이 매수다. 값은 내부 0~100.
const BUYP={FLOOR:20,RISE:20,TURN:3,WIN1:12,WIN2:12};
function buySig(K,P){P=P||BUYP;const a=K.k5.k,b=K.k10.k,g=K.k20.k,gd=K.k20.d,N=a.length,out=[];
  const tr=(x,i)=>x[i]!=null&&x[i-1]!=null&&x[i+1]!=null&&x[i]<=x[i-1]&&x[i+1]>x[i]&&x[i]<=P.FLOOR;
  let t1=null,t2=null,used=false;
  for(let i=1;i<N-1;i++){
    if(tr(a,i)){t1=i;t2=null;used=false;}
    if(t1!=null&&t2==null&&i>=t1&&i-t1<=P.WIN1&&tr(b,i)){t2=i;used=false;}
    if(t2!=null&&!used&&i>t2&&i-t2<=P.WIN2&&a[i]!=null&&b[i]!=null&&a[i-1]!=null&&b[i-1]!=null&&g[i]!=null&&gd[i]!=null&&g[i-1]!=null&&gd[i-1]!=null
       &&a[i]-a[t1]>=P.RISE&&b[i]-b[t2]>=P.RISE&&a[i]>a[i-1]&&b[i]>b[i-1]
       &&g[i]>gd[i]&&g[i-1]<=gd[i-1]&&g[i]-g[i-1]>=P.TURN){out.push({i,t1,t2});used=true;}}
  return out;}
// 매도 신호 — 'dead' = 큰형 8.0 이상에서 %K가 %D 하향돌파(세팅 탭 ▼매도와 같다) / 'aggr' = 3형제 동시 8.0 이상이 새로 성립한 봉
function sellSig(K,mode){const g=K.k20.k,gd=K.k20.d,N=g.length,out=[];
  for(let i=1;i<N;i++){
    if(mode==='aggr'){const q=stateAt(K,i),p=stateAt(K,i-1);if(!q.lack&&q.s===-2&&p.s!==-2)out.push(i);}
    else if(g[i]!=null&&gd[i]!=null&&g[i-1]!=null&&gd[i-1]!=null&&g[i]<gd[i]&&g[i-1]>=gd[i-1]&&g[i-1]>=80)out.push(i);}
  return out;}
// 매수 → 다음 매도 신호 짝. 포지션은 하나 — 매도 전에 나온 매수는 dup 로 센다. 마지막이 매도 없이 끝나면 open(그 매수 봉).
function pairUp(row,buys,sells){const c=row.c,out=[];let si=0,hold=-1,dup=0,open=null;
  for(const i of buys){if(i<=hold){dup++;continue;}
    while(si<sells.length&&sells[si]<=i)si++;
    if(si>=sells.length){open=i;break;}
    const j=sells[si];out.push({i,j,ret:(c[j]-c[i])/c[i]*100,bars:j-i});hold=j;}
  return {pairs:out,dup,open};}
function pstat(v){if(!v.length)return null;const r=v.map(x=>x.ret);
  return {n:v.length,win:r.filter(x=>x>0).length/v.length*100,avg:r.reduce((a,b)=>a+b,0)/v.length,worst:Math.min(...r),best:Math.max(...r),bars:v.reduce((a,x)=>a+x.bars,0)/v.length};}
function baseCount(a,w){const n=a.length,st=Math.max(1,n-w);let c=0;
  for(let i=st;i<n;i++)if(a[i]!=null&&a[i-1]!=null&&a[i]<=CUT&&a[i-1]>CUT)c++;return c;}
// 이평 5·10·20·60 상태. a: 1 정배열 / -1 역배열 / 0 중립, cv: 수렴중
// 수렴 판정은 고정 퍼센트가 아니라 그 봉의 변동성 대비다.
// (5분봉에 맞춘 0.4% 고정값은 60·240분봉에서 사실상 한 번도 걸리지 않았다)
const CVR=2.0;   // 이평 폭 / 최근 20봉 평균 변동폭
function maCalc(c,i){
  const m=[5,10,20,60].map(p=>{if(i+1<p)return null;let s=0;for(let j=i-p+1;j<=i;j++)s+=c[j];return s/p;});
  if(m[2]==null||m[3]==null)return{a:0,cv:false};
  const px=c[i];
  // 배열은 20·60 두 선의 위아래만 본다. 가격 위치까지 걸면 잔파동에 「중립」이 절반 가까이 나와
  // 분봉 칸이 계속 「—」로 비어 보인다.
  const a=(m[2]>m[3])?1:((m[2]<m[3])?-1:0);
  let cv=false;
  if(i>=20){let v=0;for(let j=i-19;j<=i;j++)v+=Math.abs(c[j]-c[j-1])/c[j];v/=20;
    if(v>0)cv=((Math.max(...m)-Math.min(...m))/px)/v<CVR;}
  return{a,cv};}
function maAt(c,i){const s=maCalc(c,i);return s.cv?2:s.a;}
function maState(c){return maCalc(c,c.length-1);}
function toEpoch(s){return Math.floor(new Date(s+'T15:30:00+09:00').getTime()/1000);}
function fmtT(t){if(t==null)return '-';
  if(typeof t==='number'){const d=new Date(t*1000),p=n=>String(n).padStart(2,'0');
    return `${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
  return String(t).slice(2);}

// ───────── 장중 실시간 공급기 (차트를 보는 PC에서 도는 127.0.0.1:8787) ─────────
// 브라우저에서 네이버·야후를 직접 부르면 CORS로 막힌다 — 2026-09-18 전 경로 실측.
// 그래서 PC에서 도는 공급기가 «저장소 누적원본 + 오늘 1분봉»을 합쳐 저장소와 같은 모양으로
// 내놓고, 이 페이지는 그것을 «먼저» 찾아본다. 꺼져 있으면 저장소 파일로 그대로 돌아간다.
// 공급기가 없다고 화면이 죽지 않는다 — 어제까지의 값으로 평소대로 보인다.
const LIVE_URL='http://127.0.0.1:8787';
const LIVE_VER_NEED=3;
let LIVE={on:false,last:null,ver:0};
async function loadMin(code){
  try{
    const r=await fetch(`${LIVE_URL}/min/${code}.json`,{signal:AbortSignal.timeout(8000)});
    if(r.ok){const j=await r.json();
      if(j&&j.sig&&j.sig['60m']){LIVE={on:true,last:j.liveLast||null,ver:j.ver||1};return j;}}
  }catch(e){}
  LIVE={on:false,last:null,ver:0};
  return fetch(`../stoch/min/${code}.json?t=${Date.now()}`).then(r=>r.ok?r.json():null).catch(()=>null);
}

async function loadOne(code){
  const [mn,dl]=await Promise.all([
    loadMin(code),
    fetch(`../stoch/data/${code}.json?t=${Date.now()}`).then(r=>r.ok?r.json():null).catch(()=>null)]);
  const rows=[];
  if(mn&&mn.sig)for(const tf of MIN){const s=mn.sig[tf];if(!s)continue;
    rows.push({tf,label:LBL[tf],ts:s.t,c:s.c,
      K:{k5:{k:s.k5k,d:s.k5d},k10:{k:s.k10k,d:s.k10d},k20:{k:s.k20k,d:s.k20d}}});}
  if(dl&&dl.close)for(const md of ['D','W','M']){
    const g=md==='D'?{t:dl.dates,h:dl.high,l:dl.low,c:dl.close}:regroup(dl.dates,dl.high,dl.low,dl.close,md);
    rows.push({tf:md,label:LBL[md],ts:g.t,c:g.c,K:trio(g.h,g.l,g.c)});}
  return {mn,dl,rows};}

const SN={2:'적극매수',1:'상승추세',0:'중립','-1':'하락추세','-2':'적극매도'};
const SC={2:'c2',1:'c1',0:'c0','-1':'cm1','-2':'cm2'};
// 스토캐스틱은 화면에 0~100이 아니라 0~10으로 적는다. 2026-09-18 사장님 지시.
// 내부 판정(CUT=20 등)은 그대로 0~100이고, 사람 눈에 보이는 숫자만 10으로 나눈다.
const S10=v=>v==null?'-':(v/10).toFixed(1);
const fk=x=>x==null?'-':S10(x);
const kc=x=>x==null?'<span class="c0">-</span>':(x<=CUT?`<span class="lo">${S10(x)}</span>`:(x>=100-CUT?`<span class="hi">${S10(x)}</span>`:S10(x)));

// 2026-09-17 검증 반영 —
// 적극매도는 24종목 1,000여 건에서 전 구간 음수였고(60분 944건 승률 44%),
// 정배열에서 특히 나빴다(240분 40봉 −4.08%). 그래서 정배열 칸의 적극매도는
// 「과열 주의」로 격하하고 점수·개수·수퍼매도 판정에서 빼둔다. 신호 자체는 그대로 보여준다.
// 2026-09-17 되돌림 —
// 이 함수는 정배열 칸의 적극매도를 「과열 주의」로 격하하고 있었다. 근거였던 검증 수치가
// 틀린 스토캐스틱 식(SMA 방식)으로 계산된 것이어서 근거가 사라졌다. HTS 정식으로 다시
// 검증한 뒤 다시 넣을지 정한다. 지금은 원래 판정을 그대로 통과시킨다.
function effState(r,st){
  return {s:st[r.tf].s,hot:false};}

function head(){
  const data=DATA,st={};data.rows.forEach(r=>st[r.tf]=rowState(r.K));
  const ef={};data.rows.forEach(r=>ef[r.tf]=effState(r,st));
  const SV=data.rows.filter(r=>!st[r.tf].lack).map(r=>ef[r.tf]);
  const nB=SV.filter(x=>x.s>0).length,nSB=SV.filter(x=>x.s===2).length;
  const nS=SV.filter(x=>x.s<0).length,nSS=SV.filter(x=>x.s===-2).length,tot=SV.length;
  const nHot=SV.filter(x=>x.hot).length;
  const sup=SUPER.every(tf=>ef[tf]&&ef[tf].s===2),supS=SUPER.every(tf=>ef[tf]&&ef[tf].s===-2);
  let vc='',vt,vs;
  if(sup){vc='buy';vt='★ 수퍼매수 타이밍';vs='5분·60분·240분봉이 동시에 적극매수입니다.';}
  else if(supS){vc='sell';vt='★ 수퍼매도 타이밍';vs='5분·60분·240분봉이 동시에 적극매도입니다.';}
  else if(nSB>=3){vc='buy';vt='적극매수 우세';vs=tot+'칸 중 '+nSB+'칸이 적극매수입니다.';}
  else if(nSS>=3){vc='sell';vt='적극매도 우세';vs=tot+'칸 중 '+nSS+'칸이 적극매도입니다.';}
  else if(nB>nS){vc='buy';vt='매수 우위';vs='적극매수 칸은 적습니다. 상승추세 위주입니다.';}
  else if(nS>nB){vc='sell';vt='매도 우위';vs='적극매도 칸은 적습니다. 하락추세 위주입니다.';}
  else{vt='중립';vs='어느 쪽으로도 기울지 않았습니다.';}
  const px=data.rows[0].c[data.rows[0].c.length-1];
  document.getElementById('vd').innerHTML=
    `<div class="verdict ${vc}"><div class="big">${vt}</div><div class="meta">${data.dl?data.dl.name:CODE} ${CODE} · `
    +`${px!=null?(+px).toLocaleString():'-'} · ${tot}칸 중 <b>매수 ${nB}</b>(적극 ${nSB}) / <b>매도 ${nS}</b>(적극 ${nSS})`
    +`${nHot?` · <span class="tag hot">과열 ${nHot}</span>`:''} · ${vs}</div></div>`;

  document.getElementById('tbl').innerHTML='';
}

function render(){
  const data=DATA;
  if(!data||!data.rows.length){document.getElementById('vd').innerHTML='<div class="err">이 종목의 분봉 데이터가 아직 없습니다.</div>';return;}
  if(!data.rows.some(r=>r.tf===TF))TF=data.rows[0].tf;
  head();
  // 시간축 탭 — 라벨 아래에 그 봉의 «큰형 %K»를 박아 전 시간축 요약표를 대신한다.
  // 탭마다 마지막 신호를 적는다 — ▲매수(3형제 매수 규칙)가 ▼적극매도보다 뒤면 「▲매수 N봉전」, 반대면 「▼매도 N봉전」. 2026-09-19 대표 지시.
  const lastSig=r=>{const n=r.c.length-1;const bs=buySig(r.K).map(o=>o.i);let sl=-1;
    for(let i=n;i>=1;i--){const q=stateAt(r.K,i),p=stateAt(r.K,i-1);if(!q.lack&&q.s===-2&&p.s!==-2){sl=i;break;}}
    const bl=bs.length?bs[bs.length-1]:-1;
    if(bl<0&&sl<0)return '<em class="none">-</em>';
    return bl>sl?`<em class="buy">▲매수 ${n-bl}봉전</em>`:`<em class="sell">▼매도 ${n-sl}봉전</em>`;};
  document.getElementById('tfbar').innerHTML=
    data.rows.map(r=>{const v=lastVal(r.K.k20.k);
      const col=v==null?'#9aa0a6':(v<=CUT?'#1849a9':(v>=100-CUT?'#d92d20':'#344054'));
      return `<button class="tf ${r.tf===TF?'on':''}" data-ctf="${r.tf}" title="큰형 20·12·12 · 아래는 마지막 신호">`
        +`${r.label}<b style="color:${col}">${S10(v)}</b>${lastSig(r)}</button>`;}).join('');
  const si=Math.max(0,SPANOPT.indexOf(SPAN));
  document.getElementById('spanbar').innerHTML=
    '<span class="sub">구간 폭</span><input type="range" id="sp" min="0" max="'+(SPANOPT.length-1)+'" value="'+si+'" style="width:190px;accent-color:#1849a9">'
   +'<span class="sub" id="spl" style="min-width:52px">'+(SPAN===0?'전체':SPAN+'봉')+'</span>'
   +[[60,'60봉'],[120,'120봉'],[250,'250봉'],[0,'전체']]
     .map(o=>`<button class="sm ${SPAN===o[0]?'on':''}" data-sp="${o[0]}">${o[1]}</button>`).join('')
   +'<span style="width:14px"></span><span class="sub">표시</span>'
   +[['px','가격','#0ca678'],['k5','막내','#e8590c'],['k10','둘째','#111827'],['k20','큰형','#7048e8']]
     .map(o=>`<button class="sm ${SHOW[o[0]]?'on':''}" data-sh="${o[0]}" style="border-color:${o[2]};${SHOW[o[0]]?'':'color:'+o[2]}">${o[1]}</button>`).join('');
  const spEl=document.getElementById('sp');
  spEl.oninput=e=>{SPAN=SPANOPT[+e.target.value];POS=1e9;render();};
  // 탭을 바꿔도 «보던 자리»를 유지한다. 봉 길이가 다르므로 위치를 비율로 옮긴다.
  document.querySelectorAll('[data-ctf]').forEach(b=>b.onclick=()=>{
    const rr=data.rows.find(x=>x.tf===TF),NN=rr.c.length;
    const cur=(SPAN<=0||SPAN>=NN)?NN:SPAN;
    const frac=(NN-cur)>0?POS/(NN-cur):1;
    TF=b.dataset.ctf;
    const r2=data.rows.find(x=>x.tf===TF),N2=r2.c.length;
    const s2=(SPAN<=0||SPAN>=N2)?N2:SPAN;
    POS=Math.max(0,Math.round((N2-s2)*frac));render();});
  document.querySelectorAll('[data-sh]').forEach(b=>b.onclick=()=>{SHOW[b.dataset.sh]=!SHOW[b.dataset.sh];render();});
  document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{
    const rr=data.rows.find(x=>x.tf===TF),NN=rr.c.length;
    const cur=(SPAN<=0||SPAN>=NN)?NN:SPAN, ctr=POS+cur/2;
    SPAN=+b.dataset.sp;
    const ns=(SPAN<=0||SPAN>=NN)?NN:SPAN;
    POS=Math.max(0,Math.min(NN-ns,Math.round(ctr-ns/2)));render();});

  const r=data.rows.find(x=>x.tf===TF),N=r.c.length;
  const span=(SPAN<=0||SPAN>=N)?N:SPAN;
  POS=Math.max(0,Math.min(POS,N-span));
  const a=POS,b=a+span-1;
  const sc=document.getElementById('sc');sc.max=Math.max(0,N-span);sc.value=POS;sc.disabled=(span>=N);
  document.getElementById('d0').textContent=fmtT(r.ts[a]);
  document.getElementById('d1').textContent=fmtT(r.ts[b]);
  document.getElementById('mid').textContent=`${LBL[TF]} ${span}봉 / 전체 ${N}봉`;

  // ▲매수 = 3형제 매수 규칙(buySig). 종전 «3형제 동시 2.0↓» 적극매수 표시는 2026-09-18 대표 지시로 교체(검증 탭에 비교 줄로 남긴다).
  const BUY=buySig(r.K).map(o=>o.i),SELL=[];
  for(let i=1;i<N;i++){const q=stateAt(r.K,i),p=stateAt(r.K,i-1);
    if(!q.lack&&q.s===-2&&p.s!==-2)SELL.push(i);}

  const labels=[],px=[],k5=[],k10=[],k20=[];
  for(let i=a;i<=b;i++){labels.push(fmtT(r.ts[i]));px.push(r.c[i]);
    k5.push(r.K.k5.k[i]);k10.push(r.K.k10.k[i]);k20.push(r.K.k20.k[i]);}
  const line=(d,col,w,ax,o,dash)=>({data:d,borderColor:col,borderWidth:w,borderDash:dash||[],pointRadius:0,tension:.25,yAxisID:ax,order:(o==null?3:o)});
  const ds=[];const NM=[];
  // 가격선은 굵게 맨 위에, 흰 테두리를 깔아 스토캐스틱 선과 확실히 떨어뜨린다
  if(SHOW.px){ds.push(line(px,'rgba(255,255,255,.95)',7,'y',2));NM.push(null);
              ds.push(line(px,'#0ca678',3.4,'y',1));NM.push('종가');}
  if(SHOW.k5){ds.push(line(k5,'#e8590c',1.3,'y2'));NM.push('막내');}
  if(SHOW.k10){ds.push(line(k10,'#0b1220',1.3,'y2'));NM.push('둘째');}
  // 큰형은 가장 두껍게, 전부 실선. 2026-09-19 대표 「파동선 전부 실선, 큰형 가장 두껍게」(점선은 그 전날 지시).
  if(SHOW.k20){ds.push(line(k20,'#7048e8',2.4,'y2'));NM.push('큰형');}
  ds.push({data:labels.map(()=>CUT),borderColor:'rgba(217,45,32,.5)',borderWidth:1,borderDash:[5,4],pointRadius:0,yAxisID:'y2',order:4});
  ds.push({data:labels.map(()=>100-CUT),borderColor:'rgba(24,73,169,.5)',borderWidth:1,borderDash:[5,4],pointRadius:0,yAxisID:'y2',order:4});

  const tap={id:'tap',beforeDatasetsDraw(ch){
    const ca=ch.chartArea,xs=ch.scales.x;if(!ca||!xs)return;const g=ch.ctx;
    // 이평 배열 바탕색·수렴 띠는 2026-09-18 사장님 지시로 제거했다(판정에 쓰지 않는다).
    const by0=ca.bottom;
    // 지금 보는 시간축의 3형제 %K·%D를 차트 왼쪽 위에 얹는다.
    (function(){
      const q=(o)=>{const v=o.k[b],d=o.d[b];return S10(v)+' / '+S10(d);};
      const items=[['막내','#e8590c',r.K.k5],['둘째','#0b1220',r.K.k10],['큰형','#7048e8',r.K.k20]];
      g.save();g.font='bold 12px -apple-system,Malgun Gothic,sans-serif';g.textAlign='left';
      let x=ca.left+6;const y=ca.top+14;
      const txts=items.map(it=>it[0]+' '+q(it[2]));
      const w=txts.reduce((s2,t)=>s2+g.measureText(t).width+16,0)+6;
      g.fillStyle='rgba(255,255,255,.88)';g.fillRect(ca.left+2,ca.top+2,w,18);
      items.forEach((it,i)=>{g.fillStyle=it[1];g.fillText(txts[i],x,y);x+=g.measureText(txts[i]).width+16;});
      g.restore();})();
    const mark=(list,ln,fl,dir,tx)=>{list.forEach(i=>{if(i<a||i>b)return;const x=xs.getPixelForValue(i-a);
      g.save();g.strokeStyle=ln;g.lineWidth=1.3;g.setLineDash([5,4]);
      g.beginPath();g.moveTo(x,ca.top);g.lineTo(x,ca.bottom);g.stroke();g.setLineDash([]);
      g.fillStyle=fl;g.beginPath();
      if(dir>0){g.moveTo(x,by0-6);g.lineTo(x-8,by0-22);g.lineTo(x+8,by0-22);}
      else{g.moveTo(x,ca.top+4);g.lineTo(x-8,ca.top+20);g.lineTo(x+8,ca.top+20);}
      g.closePath();g.fill();
      g.strokeStyle='#fff';g.lineWidth=1.5;g.stroke();
      // 화살표 옆 글자
      g.font='bold 11px -apple-system,Malgun Gothic,sans-serif';g.textAlign='center';
      const ty=(dir>0)?by0-26:ca.top+33;
      const w=g.measureText(tx).width+8;
      g.fillStyle='rgba(255,255,255,.85)';g.fillRect(x-w/2,ty-11,w,14);
      g.fillStyle=fl;g.fillText(tx,x,ty);
      g.restore();});};
    mark(BUY,'rgba(217,45,32,.6)','#d92d20',1,'매수');
    mark(SELL,'rgba(24,73,169,.6)','#1849a9',-1,'적극매도');}};

  // 차트 위에서 휠 = 구간 폭 조정, Shift+휠 = 좌우 이동. 커서 자리를 기준으로 확대·축소한다.
  const box=document.querySelector('.cbox');
  if(!box.dataset.bound){
    box.dataset.bound='1';
    let dg=false,sx=0,sp=0;
    box.addEventListener('pointerdown',e=>{dg=true;sx=e.clientX;sp=POS;box.classList.add('drag');
      try{box.setPointerCapture(e.pointerId);}catch(_){}} );
    box.addEventListener('pointermove',e=>{if(!dg)return;
      const rr=DATA.rows.find(x=>x.tf===TF),NN=rr.c.length;
      const cur=(SPAN<=0||SPAN>=NN)?NN:SPAN;
      POS=Math.max(0,Math.min(NN-cur,sp-Math.round((e.clientX-sx)/(box.clientWidth||800)*cur)));
      render();});
    const up=()=>{dg=false;box.classList.remove('drag');};
    box.addEventListener('pointerup',up); box.addEventListener('pointercancel',up);
    box.addEventListener('wheel',(ev)=>{
      ev.preventDefault();
      const rr=DATA.rows.find(x=>x.tf===TF),NN=rr.c.length;
      const cur=(SPAN<=0||SPAN>=NN)?NN:SPAN;
      const rect=box.getBoundingClientRect();
      const frac=Math.min(1,Math.max(0,(ev.clientX-rect.left)/rect.width));
      if(ev.shiftKey){
        POS=Math.max(0,Math.min(NN-cur,POS+Math.sign(ev.deltaY)*Math.max(1,Math.round(cur*0.12))));
        render();return;}
      // 스캐너와 같은 배율 — 넓힐 때 ×1.25, 좁힐 때 ×0.8, 최소 20봉
      let ns=Math.round(ev.deltaY>0?cur*1.25:cur*0.8);
      ns=Math.max(20,Math.min(ns,NN));
      const anchor=POS+cur*frac;
      SPAN=(ns>=NN)?0:ns;
      POS=Math.max(0,Math.min(NN-ns,Math.round(anchor-ns*frac)));
      render();},{passive:false});
  }

  if(chart)chart.destroy();
  chart=new Chart(document.getElementById('cv'),{type:'line',data:{labels,datasets:ds},plugins:[tap],
    options:{responsive:true,maintainAspectRatio:false,animation:false,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>{const nm=NM[c.datasetIndex];if(!nm)return null;
        const y=c.parsed.y;return nm+' '+(y==null?'-':(c.dataset.yAxisID==='y2'?S10(y):Math.round(y*10)/10));}}}},
      scales:{x:{ticks:{color:'#6b7280',maxTicksLimit:8,font:{size:10}},grid:{color:'#eceef1'}},
        y:{position:'left',ticks:{color:'#6b7280',font:{size:10}},grid:{color:'#eceef1'}},
        y2:{position:'right',min:0,max:100,ticks:{color:'#6b7280',stepSize:20,font:{size:10},callback:v=>v/10},grid:{display:false}}}}});

  document.getElementById('d0').textContent=fmtT(r.ts[a]);
  document.getElementById('d1').textContent=fmtT(r.ts[b]);
  document.getElementById('mid').textContent=`${LBL[TF]} · 폭 ${span}봉 / 전체 ${N}봉 · 이 구간 ▲${BUY.filter(i=>i>=a&&i<=b).length} ▼${SELL.filter(i=>i>=a&&i<=b).length}`;

  document.getElementById('foot').innerHTML=
    `<b>적극매수</b> = 3형제 %K가 모두 ${S10(CUT)} 이하 · <b>적극매도</b> = 모두 ${S10(100-CUT)} 이상 · `
   +`<b>상승추세</b> = 셋 중 둘 이상이 ${TRN}봉 전보다 높음. 적극과 추세는 섞지 않고 개수도 따로 셉니다.<br>`
   +`차트의 <b>▲▼가 조건이 새로 성립한 자리</b>입니다 — 붉은 ▲는 <b>3형제 매수 규칙</b>(막내가 ${S10(BUYP.FLOOR)} 이하 바닥을 찍고 → 둘째가 바닥을 찍고 → 둘 다 저점보다 ${S10(BUYP.RISE)} 이상 올라 오르는 중일 때 큰형이 어느 높이에서든 %D를 위로 뚫으며 한 봉에 ${S10(BUYP.TURN)} 이상 솟는 봉), 푸른 ▼는 적극매도. 위 적극매수 칸 색은 종전 기준 그대로입니다.<br>`
   +'<b>봉 주기별 쓰임</b> — <b>5분봉 = 단타</b>, <b>60분봉 = 스윙</b>(사흘~2주), <b>240분봉 = 추세</b>(며칠~몇 주). '
   +'스윙이면 60분봉에서 타점을 잡되 일봉이 어느 쪽인지 반드시 같이 보십시오.<br>'
   +'<b>★ 수퍼매수</b> = 5분·60분·240분봉 동시 적극매수. 간격을 크게 벌린 셋이라 서로 다른 시간대를 확인합니다.<br>'
   +`<b>다지기</b> = 최근 60봉에서 막내 %K가 ${S10(CUT)} 아래로 새로 내려간 횟수. 많이 다질수록 확률이 올라가되, `
   +'그동안 가격이 저점을 낮추지 않았어야 응축입니다.<br>'
   +'· 야후 분봉이 14:55까지만 주는 구간은 <b>네이버 1분봉으로 15:30까지 메웁니다</b>(그 구간 고·저가는 1분 종가의 최대·최소). '
   +'1분봉은 8일치부터 시작해 매일 쌓입니다.<br>'
   +'⚠ 월봉 큰형(20,12)은 일봉 500봉으로는 기간이 모자라 «데이터 부족»입니다.<br>'
   +'<b>계산식 교정(2026-09-17)</b> — %K·%D를 HTS 정식으로 바꿨습니다. '
   +'Σ(종가−n기간최저)/Σ(n기간최고−n기간최저), %D는 지수이동평균입니다. '
   +'사장님 HTS가 내보낸 60분봉 900봉과 오차 0으로 맞췄습니다. '

   +'⚠ <b>이 교정 전에 돌린 검증 수치는 모두 무효</b>입니다. 그 숫자를 근거로 넣었던 «정배열 적극매도 격하»도 되돌렸습니다. '
   +'바른 식으로 다시 검증한 뒤 조건을 다시 정합니다.<br>'

   +(LIVE.on?` · <b class="lo">실시간 ON</b> — 공급기가 오늘 ${LIVE.last||'-'} 봉까지 붙였습니다`
            :' · <b>실시간 OFF</b> — 저장소 파일(평일 15:10 수집분)입니다');
}

// ───────── 검증 (매수·매도 결과) ─────────
let VHOLD=20, VROWS=null, VTAB=false, VMODE='one', VALL=null;
const HOLDS=[5,10,20,40];

function dayKey(t){return Math.floor((t+32400)/86400);}   // KST 기준 날짜

function chunkDay(o,k){
  const ts=[],h=[],l=[],c=[];
  let i=0;
  while(i<o.ts.length){
    const d=dayKey(o.ts[i]);
    let j=i;
    while(j<o.ts.length&&dayKey(o.ts[j])===d){
      const e=Math.min(j+k,o.ts.length);
      let hi=-1e18,lo=1e18;
      let m=j;
      for(;m<e&&dayKey(o.ts[m])===d;m++){if(o.h[m]>hi)hi=o.h[m];if(o.l[m]<lo)lo=o.l[m];}
      ts.push(o.ts[j]);h.push(hi);l.push(lo);c.push(o.c[m-1]);
      j=m;}
    i=j;}
  return {ts,h,l,c};}

// 1분봉을 «시계» 기준으로 묶는다 — 09:00(KST) 기점 mins분 단위. 봉 시각은 묶음 시작 시각, 09:00 이전 봉은 버린다.
function chunkClock(o,mins){
  const ts=[],h=[],l=[],c=[];const step=mins*60;let key=null,hi=0,lo=0,cl=0;
  for(let i=0;i<o.ts.length;i++){const t=o.ts[i];
    const since9=((t+32400)%86400+86400)%86400-32400; if(since9<0)continue;
    const k=t-since9+Math.floor(since9/step)*step;
    if(k!==key){if(key!==null){ts.push(key);h.push(hi);l.push(lo);c.push(cl);}key=k;hi=o.h[i];lo=o.l[i];cl=o.c[i];}
    else{if(o.h[i]>hi)hi=o.h[i];if(o.l[i]<lo)lo=o.l[i];cl=o.c[i];}}
  if(key!==null){ts.push(key);h.push(hi);l.push(lo);c.push(cl);}
  return {ts,h,l,c};}

// 누적 원본(gz)을 받아 훨씬 긴 이력으로 다시 계산한다. 화면용 300봉으로는 표본이 모자란다.
async function loadRawRows(code){
  try{
    // 세팅·검증 탭은 DATA 를 쓰지 않고 누적 원본을 직접 받아 자체 계산한다.
    // 그래서 여기서도 공급기를 «먼저» 본다 — 안 그러면 세팅 탭만 어제 값으로 남는다.
    let d=null;
    try{
      const lr=await fetch(`${LIVE_URL}/raw/${code}.json`,{signal:AbortSignal.timeout(12000)});
      if(lr.ok){const j=await lr.json(); if(j&&j['60m']&&j['60m'].t)d=j;}
    }catch(e){}
    if(!d){
      const r=await fetch(`../stoch/min/raw/${code}.json.gz?t=${Date.now()}`);
      if(!r.ok)return null;
      const txt=await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).text();
      d=JSON.parse(txt);
    }
    const o={};
    for(const tf of ['1m','3m','5m','30m','60m'])if(d[tf]&&d[tf].t&&d[tf].t.length>80)
      o[tf]={ts:d[tf].t,h:d[tf].h,l:d[tf].l,c:d[tf].c};
    // 저장소 누적원본(gz)에는 3분봉이 없다(공급기 /raw 에만 있다). 없으면 1분봉을 09:00 기점 3분 단위로
    // 묶어 만든다 — 공급기 clock_chunk·collect_min.clock_chunk 와 같은 규칙. 2026-09-18
    if(!o['3m']&&o['1m'])o['3m']=chunkClock(o['1m'],3);
    if(o['5m'])o['10m']=chunkDay(o['5m'],2);
    if(o['60m']){o['120m']=chunkDay(o['60m'],2);o['240m']=chunkDay(o['60m'],4);}
    const out=[];
    for(const tf of MIN)if(o[tf])out.push({tf,label:LBL[tf],ts:o[tf].ts,c:o[tf].c,K:trio(o[tf].h,o[tf].l,o[tf].c)});
    return out.length?out:null;
  }catch(e){return null;}}

// 신호가 «새로» 성립한 봉만 골라 hold봉 뒤 수익률을 잰다. 매도는 부호를 뒤집어 「맞았는가」로 본다.
function sigList(row,want,hold){
  const K=row.K,c=row.c,n=c.length,out=[];
  for(let i=1;i+hold<n;i++){
    const q=stateAt(K,i);if(q.lack||q.s!==want)continue;
    const p=stateAt(K,i-1);if(p.s===want)continue;
    const ret=(c[i+hold]-c[i])/c[i]*100*(want===2?1:-1);
    out.push({i,ret,a:maCalc(c,i).a});}
  return out;}

function agg(list){
  if(!list.length)return null;
  const w=list.filter(x=>x.ret>0).length;
  const m=list.reduce((s,x)=>s+x.ret,0)/list.length;
  return {n:list.length,win:w/list.length*100,avg:m};}

function cell(a){
  if(!a)return '<td class="num small">-</td><td class="num small">-</td>';
  const wc=a.win>=50?'pos':'neg', ac=a.avg>0?'pos':'neg';
  return `<td class="num"><span class="${wc}">${a.win.toFixed(0)}%</span> <span class="small">${a.n}</span></td>`
        +`<td class="num ${ac}">${a.avg>0?'+':''}${a.avg.toFixed(2)}%</td>`;}

function vTable(rows,want,hold){
  const title=want===2?'적극매수':'적극매도';
  let body='',tot=[],totP=[],totN=[];
  for(const r of rows){
    const L=sigList(r,want,hold);
    tot=tot.concat(L);
    const P=L.filter(x=>x.a>0),N=L.filter(x=>x.a<0);
    totP=totP.concat(P);totN=totN.concat(N);
    body+=`<tr><td><b>${r.label}</b>${RTAG(r.tf)}<span class="small"> ${r.c.length}봉</span></td>`
        +cell(agg(L))+cell(agg(P))+cell(agg(N))+'</tr>';}
  body+=`<tr class="avg"><td><b>합계</b></td>`+cell(agg(tot))+cell(agg(totP))+cell(agg(totN))+'</tr>';
  return `<h2>${title} 결과 · ${hold}봉 뒤</h2>
    <table><thead><tr><th>봉</th>
      <th colspan="2" style="text-align:left">전체 (승률·표본 / 평균)</th>
      <th colspan="2" style="text-align:left">정배열에서 난 신호</th>
      <th colspan="2" style="text-align:left">역배열에서 난 신호</th></tr></thead>
    <tbody>${body}</tbody></table>`;}

// ── 관심종목 전체 합산 ──────────────────────────────
// 한 종목 한 구간의 수십 건으로는 정배열 가점 같은 조건을 판정할 수 없다.
// 관심종목 전부의 신호를 한 통에 모아야 숫자가 흔들리지 않는다.
async function loadAll(prog){
  const out=[];
  const codes=WL.slice();
  let done=0;
  const work=async ()=>{
    while(codes.length){
      const c=codes.shift();
      const r=await loadRawRows(c);
      done++; if(prog)prog(done,WL.length);
      if(r)out.push({code:c,rows:r});
    }};
  await Promise.all([work(),work(),work(),work()]);
  return out;}

function vTableAll(all,want,hold){
  const title=want===2?'적극매수':'적극매도';
  const byTf={};
  for(const t of all)for(const r of t.rows){
    (byTf[r.tf]=byTf[r.tf]||[]).push(...sigList(r,want,hold));}
  let body='',tot=[],totP=[],totN=[];
  for(const tf of MIN){
    const L=byTf[tf]; if(!L||!L.length)continue;
    const P=L.filter(x=>x.a>0),N=L.filter(x=>x.a<0);
    tot=tot.concat(L);totP=totP.concat(P);totN=totN.concat(N);
    body+=`<tr><td><b>${LBL[tf]}</b>${RTAG(tf)}</td>`+cell(agg(L))+cell(agg(P))+cell(agg(N))+'</tr>';}
  body+=`<tr class="avg"><td><b>합계</b></td>`+cell(agg(tot))+cell(agg(totP))+cell(agg(totN))+'</tr>';
  return `<h2>${title} 결과 · ${hold}봉 뒤 · ${all.length}종목 합산</h2>
    <table><thead><tr><th>봉</th>
      <th colspan="2" style="text-align:left">전체 (승률·표본 / 평균)</th>
      <th colspan="2" style="text-align:left">정배열에서 난 신호</th>
      <th colspan="2" style="text-align:left">역배열에서 난 신호</th></tr></thead>
    <tbody>${body}</tbody></table>`;}


// ═══════════ 60분봉 매매세팅 검증 ═══════════
// 기준① 단독(첫 봉 진입·고정 청산)이 아니라 «세팅 규칙 그대로» 잰다.
//   진입 = 60분 큰형이 20 아래로 갔다가 20 위로 복귀하는 봉(반등 확인)
//   청산 = 80 위에서 %K가 %D를 하향돌파(데드크로스)
// 한 사이클은 다음 20↓ 진입 전까지다. 수수료·세금은 넣지 않았다.
function g240At(r240,ts){
  if(!r240)return null;
  const T=r240.ts,K=r240.K.k20.k;
  let lo=0,hi=T.length-1,idx=-1;
  while(lo<=hi){const m=(lo+hi)>>1;if(T[m]<=ts){idx=m;lo=m+1;}else hi=m-1;}
  return idx<0?null:K[idx];}

function setCycles(r60,r240){
  const K=r60.K.k20.k,D=r60.K.k20.d,C=r60.c,N=K.length,out=[];
  let i=1;
  while(i<N){
    if(!(K[i]!=null&&K[i]<=20&&K[i-1]!=null&&K[i-1]>20)){i++;continue;}
    const s=i;
    let j=i+1;
    while(j<N&&!(K[j]!=null&&K[j]>20&&K[j-1]!=null&&K[j-1]<=20))j++;
    if(j>=N)break;
    const e=j;
    let lim=e+1;
    while(lim<N&&!(K[lim]!=null&&K[lim]<=20&&K[lim-1]!=null&&K[lim-1]>20))lim++;
    lim=Math.min(lim,N-1);
    const f=(cond,frm)=>{for(let k=(frm==null?e:frm);k<=lim;k++)if(cond(k))return k;return null;};
    const i80=f(k=>K[k]!=null&&K[k]>=80);
    const dead=i80==null?null:f(k=>K[k]!=null&&D[k]!=null&&K[k-1]!=null&&D[k-1]!=null&&K[k]<D[k]&&K[k-1]>=D[k-1]&&K[k-1]>=80,i80);
    const iout=i80==null?null:f(k=>K[k]!=null&&K[k]<80,i80);
    const ibend=i80==null?null:f(k=>k>=3&&K[k]!=null&&K[k-3]!=null&&K[k]<K[k-3]&&K[k-3]>=80,i80);
    let low=Infinity,peak=-Infinity;
    for(let k=s;k<=e;k++)if(C[k]<low)low=C[k];
    for(let k=e;k<=(dead==null?lim:dead);k++)if(C[k]>peak)peak=C[k];
    // 무산(80 미도달) 사이클도 결과에 넣어야 공평하다. 두 가지로 센다.
    //   hold — 사이클을 넘겨서라도 데드크로스가 올 때까지 기다린다(사람이 실제로 하는 쪽)
    //   cut  — 다음 20↓ 진입 시점에 손절하고 새 사이클로 간다
    let held=null;
    for(let k=(i80==null?e:i80);k<N;k++){
      if(K[k]==null||D[k]==null||K[k-1]==null||D[k-1]==null)continue;
      if(K[k]<D[k]&&K[k-1]>=D[k-1]&&K[k-1]>=80){held=k;break;}}
    out.push({s,e,i80,dead,iout,ibend,lim,held,ep:C[e],low,peak,g:g240At(r240,r60.ts[e])});
    i=Math.max(e+1,lim);}
  return out;}

function pct(C,i,ep){return i==null?null:(C[i]-ep)/ep*100;}
function stat(v){
  if(!v.length)return null;
  return {n:v.length,win:v.filter(x=>x>0).length/v.length*100,avg:v.reduce((a,b)=>a+b,0)/v.length,
          worst:Math.min(...v),best:Math.max(...v)};}
function scell(a){
  if(!a)return '<td class="num small">-</td><td class="num small">-</td>';
  return `<td class="num"><span class="${a.win>=50?'pos':'neg'}">${a.win.toFixed(0)}%</span> <span class="small">${a.n}</span></td>`
        +`<td class="num ${a.avg>0?'pos':'neg'}">${a.avg>0?'+':''}${a.avg.toFixed(2)}%</td>`;}

// 한 종목의 사이클을 규칙별·240분 수준별로 집계
function setAgg(r60,r240){
  const cy=setCycles(r60,r240),C=r60.c;
  const R={hold:[],cut:[],dead:[],out80:[],bend:[],hit80:[],peak:[],dd:[],
           miss:0,n:cy.length,g:{lo:[],mid:[],hi:[],na:[]}};
  for(const c of cy){
    // ① 전체 사이클 — 무산 포함
    const hd=pct(C,c.held,c.ep);
    if(hd!=null)R.hold.push(hd);
    const cutIdx=(c.dead!=null)?c.dead:c.lim;
    const ct=pct(C,cutIdx,c.ep);
    if(ct!=null){
      R.cut.push(ct);
      const g=c.g;
      (g==null?R.g.na:(g<30?R.g.lo:(g>70?R.g.hi:R.g.mid))).push(ct);}
    if(c.i80==null)R.miss++;
    // ② 80에 닿은 사이클만 — 청산 규칙 비교용
    const d=pct(C,c.dead,c.ep); if(d!=null)R.dead.push(d);
    const o=pct(C,c.iout,c.ep); if(o!=null)R.out80.push(o);
    const b=pct(C,c.ibend,c.ep); if(b!=null)R.bend.push(b);
    const h=pct(C,c.i80,c.ep); if(h!=null)R.hit80.push(h);
    if(c.peak>-Infinity&&c.dead!=null)R.peak.push((c.peak-c.ep)/c.ep*100);
    if(c.low<Infinity)R.dd.push((c.low-c.ep)/c.ep*100);}
  return {cy,R};}

function setTables(list){   // list: [{code,r60,r240}]
  const M={hold:[],cut:[],dead:[],out80:[],bend:[],hit80:[],peak:[],dd:[]},
        G={lo:[],mid:[],hi:[]}, per=[]; let miss=0,tot=0;
  for(const x of list){
    const {R}=setAgg(x.r60,x.r240);
    for(const k in M)M[k]=M[k].concat(R[k]);
    for(const k of ['lo','mid','hi'])G[k]=G[k].concat(R.g[k]);
    miss+=R.miss; tot+=R.n;
    const st=stat(R.hold);
    if(st)per.push({code:x.code,st});}
  per.sort((a,b)=>b.st.avg-a.st.avg);
  const row=(nm,a,note)=>`<tr><td><b>${nm}</b></td>${scell(a)}<td class="num small">${a?((a.worst>0?'+':'')+a.worst.toFixed(1)+'%'):'-'}</td><td class="small">${note||''}</td></tr>`;
  let html=`<h2>전체 사이클 — 무산 포함</h2>
    <table><thead><tr><th>무산 처리 방식</th><th colspan="2" style="text-align:left">승률·건수 / 평균</th><th>최악</th><th style="text-align:left">뜻</th></tr></thead><tbody>
    ${row('끝까지 보유',stat(M.hold),'8.0에 못 닿아도 데드크로스가 올 때까지 기다린다')}
    ${row('다음 2.0↓에서 손절',stat(M.cut),'무산되면 다음 사이클 진입 시점에 정리한다')}
    </tbody></table>
    <p class="note" style="margin:0 0 4px">사이클 ${tot}개 중 <b>${miss}개(${(miss/tot*100).toFixed(0)}%)가 8.0에 못 닿고 무산</b>됐습니다.
    아래 «청산 규칙 비교»는 <b>8.0에 닿은 ${tot-miss}개만</b>으로 낸 것이라 승률이 높게 나옵니다 — 규칙끼리 견줄 때만 보십시오.</p>
    <h2>청산 규칙 비교 · 8.0에 닿은 사이클만</h2>
    <table><thead><tr><th>청산 규칙</th><th colspan="2" style="text-align:left">승률·건수 / 평균</th><th>최악</th><th style="text-align:left">비고</th></tr></thead><tbody>
    ${row('데드크로스',stat(M.dead),'8.0 위에서 %K가 %D 하향돌파 — 세팅 기본값')}
    ${row('8.0 이탈',stat(M.out80),'큰형이 8.0 아래로')}
    ${row('큰형 3봉 꺾임',stat(M.bend),'')}
    ${row('8.0 도달 즉시',stat(M.hit80),'가장 이르다')}
    ${row('사이클 최고가',stat(M.peak),'도달 불가능한 상한 — 비교용')}
    </tbody></table>`;
  const dq=stat(M.dd);
  html+=`<h2>240분 수준별 · 무산 포함(손절 방식)</h2>
    <table><thead><tr><th>진입 시 240분 큰형</th><th colspan="2" style="text-align:left">승률·건수 / 평균</th><th style="text-align:left">읽는 법</th></tr></thead><tbody>
    <tr><td><b>3.0 미만</b></td>${scell(stat(G.lo))}<td class="small">상위도 같이 무너진 자리</td></tr>
    <tr><td><b>3.0 ~ 7.0</b></td>${scell(stat(G.mid))}<td class="small">상위에 여력 있는 자리</td></tr>
    <tr><td><b>7.0 초과</b></td>${scell(stat(G.hi))}<td class="small">상위가 이미 과열</td></tr>

// 60분 큰형으로 사이클을 읽는다
function cyc60(r){
  const K=r.K.k20.k, D=r.K.k20.d, N=K.length;
  const ZL=[],ZH=[],BUY=[],SELL=[];
  let lo=null,hi=null;
  for(let i=1;i<N;i++){
    if(K[i]==null){continue;}
    if(K[i]<=20){if(lo==null)lo=i;}
    else if(lo!=null){ZL.push([lo,i-1]);BUY.push(i);lo=null;}
    if(K[i]>=80){if(hi==null)hi=i;}
    else if(hi!=null){ZH.push([hi,i-1]);hi=null;}
    if(D[i]!=null&&D[i-1]!=null&&K[i-1]!=null&&K[i]<D[i]&&K[i-1]>=D[i-1]&&K[i-1]>=80)SELL.push(i);
  }
  if(lo!=null)ZL.push([lo,N-1]);
  if(hi!=null)ZH.push([hi,N-1]);
  // 현재 단계 — 마지막 20 이하 진입부터 추적
  let stage='대기', sIdx=null;
  for(let i=N-1;i>=1;i--){if(K[i]!=null&&K[i]<=20){sIdx=i;break;}}
  if(sIdx!=null){
    const rb=BUY.filter(i=>i>sIdx)[0];
    const i80=ZH.map(z=>z[0]).filter(i=>i>sIdx)[0];
    const dd=SELL.filter(i=>i>sIdx)[0];
    if(dd!=null)stage='청산 완료';
    else if(i80!=null)stage='매도 준비';
    else if(rb!=null)stage='보유';
    else stage='분할매수';
    if(K[N-1]!=null&&K[N-1]<=20)stage='분할매수';
  }
  return {ZL,ZH,BUY,SELL,stage,k:K[N-1],d:D[N-1]};
}

function split5(r){
  const out=[];
  for(const [key,nm] of [['k5','막내'],['k10','둘째']]){
    const a=r.K[key].k;
    for(let i=1;i<a.length;i++)
      if(a[i]!=null&&a[i-1]!=null&&a[i]<=20&&a[i-1]>20)out.push({i,nm});}
  const b=r.K.k20.k;                       // 큰형 = 하락하다 반전 상승(저점이 30 이하)
  for(let i=2;i<b.length;i++)
    if(b[i]!=null&&b[i-1]!=null&&b[i-2]!=null&&b[i-1]<=30&&b[i]>b[i-1]&&b[i-1]<=b[i-2])
      out.push({i,nm:'큰형'});
  return out.sort((x,y)=>x.i-y.i);
}

function gate240(r){
  if(!r)return {cls:'mid',txt:'240분 데이터 없음',v:null};
  const K=r.K.k20.k, v=K[K.length-1];
  if(v==null)return {cls:'mid',txt:'240분 계산 불가',v:null};
  // 2026-09-17 재검증 — 24종목·무산 포함 1,464 사이클에서
  // 30미만 756건 38% / 30~70 607건 39% / 70초과 89건 27%.
  // «30 미만이 위험»은 11건짜리 단일 종목 관찰이어서 근거가 없었다. 70 초과만 경고한다.
  if(v>70)return {cls:'no',txt:`240분 큰형 ${S10(v)} — 큰 흐름이 이미 과열. 실측 89건 승률 27%로 가장 나빴다`,v};
  if(v<30)return {cls:'ok',txt:`240분 큰형 ${S10(v)} — 큰 흐름도 낮다. 실측상 3.0~7.0과 차이 없다(38 vs 39%)`,v};
  return {cls:'ok',txt:`240분 큰형 ${S10(v)} — 큰 흐름 무리 없음`,v};
}

function drawSet(tf,cid,r,cy,sp5){
  const N=r.c.length;
  if(SBARS[tf]==null)SBARS[tf]=Math.round(SBASE[tf]*SMUL);
  const span=Math.max(20,Math.min(SBARS[tf],N));
  if(SOFF[tf]==null)SOFF[tf]=0;
  SOFF[tf]=Math.max(0,Math.min(N-span,SOFF[tf]));
  const b=N-1-SOFF[tf], a=b-span+1;
  const labels=[],px=[],k5=[],k10=[],k20=[];
  for(let i=a;i<=b;i++){labels.push(fmtT(r.ts[i]));px.push(r.c[i]);
    k5.push(r.K.k5.k[i]);k10.push(r.K.k10.k[i]);k20.push(r.K.k20.k[i]);}
  const ln=(d,col,w,ax,o)=>({data:d,borderColor:col,borderWidth:w,pointRadius:0,tension:.25,yAxisID:ax,order:o});
  const ds=[ln(px,'rgba(255,255,255,.95)',7,'y',2), ln(px,'#0ca678',3.4,'y',1),
            ln(k5,'#e8590c',1.3,'y2',3), ln(k10,'#0b1220',1.3,'y2',3),
            ln(k20,'#7048e8',2.4,'y2',3),
            {data:labels.map(()=>20),borderColor:'rgba(217,45,32,.5)',borderWidth:1,borderDash:[5,4],pointRadius:0,yAxisID:'y2',order:4},
            {data:labels.map(()=>80),borderColor:'rgba(24,73,169,.5)',borderWidth:1,borderDash:[5,4],pointRadius:0,yAxisID:'y2',order:4}];
  const NM=[null,'가격','막내','둘째','큰형'];
  const plug={id:'s'+tf,beforeDatasetsDraw(ch){
    const ca=ch.chartArea,xs=ch.scales.x;if(!ca||!xs)return;const g=ch.ctx;
    const X=i=>xs.getPixelForValue(i-a);
    // 타이밍 탭과 같은 자리에 3형제 %K/%D
    (function(){
      const q=o=>{const v=o.k[b],d=o.d[b];return S10(v)+' / '+S10(d);};
      const items=[['막내','#e8590c',r.K.k5],['둘째','#0b1220',r.K.k10],['큰형','#7048e8',r.K.k20]];
      g.save();g.font='bold 11px -apple-system,Malgun Gothic,sans-serif';g.textAlign='left';
      const txts=items.map(it=>it[0]+' '+q(it[2]));
      const w=txts.reduce((s2,t)=>s2+g.measureText(t).width+14,0)+6;
      g.fillStyle='rgba(255,255,255,.88)';g.fillRect(ca.left+2,ca.top+2,w,16);
      let x=ca.left+6;const y=ca.top+13;
      items.forEach((it,i)=>{g.fillStyle=it[1];g.fillText(txts[i],x,y);x+=g.measureText(txts[i]).width+14;});
      g.restore();})();
    if(tf==='60m'){
      // 큰형 2.0 이하·8.0 이상 구간의 세로 띠는 2026-09-18 사장님 지시로 지웠다. ▲매수·▼매도 표시만 남긴다.
      const mark=(list,col,dir,tx)=>list.forEach(i=>{if(i<a||i>b)return;const x=X(i);
        g.save();g.strokeStyle=col;g.lineWidth=1.3;g.setLineDash([5,4]);
        g.beginPath();g.moveTo(x,ca.top);g.lineTo(x,ca.bottom);g.stroke();g.setLineDash([]);
        g.fillStyle=col;g.beginPath();
        if(dir>0){g.moveTo(x,ca.bottom-6);g.lineTo(x-8,ca.bottom-22);g.lineTo(x+8,ca.bottom-22);}
        else{g.moveTo(x,ca.top+4);g.lineTo(x-8,ca.top+20);g.lineTo(x+8,ca.top+20);}
        g.closePath();g.fill();g.strokeStyle='#fff';g.lineWidth=1.5;g.stroke();
        g.font='bold 11px -apple-system,Malgun Gothic,sans-serif';g.textAlign='center';
        const ty=(dir>0)?ca.bottom-26:ca.top+33, w=g.measureText(tx).width+8;
        g.fillStyle='rgba(255,255,255,.88)';g.fillRect(x-w/2,ty-11,w,14);
        g.fillStyle=col;g.fillText(tx,x,ty);g.restore();});
      mark(cy.BUY,'#d92d20',1,'매수');
      mark(cy.SELL,'#1849a9',-1,'매도');
      // 3형제 매수 규칙(buySig) 표식 — 세팅 사이클과 별개로 얹는다(계획서 §2-4). 주황 ▼「3형제 매수」, 사이클 ▲보다 위 칸.
      buySig(r.K).forEach(o=>{const i=o.i;if(i<a||i>b)return;const x=X(i);
        g.save();g.fillStyle='#e8590c';g.beginPath();g.moveTo(x,ca.bottom-30);g.lineTo(x-6,ca.bottom-42);g.lineTo(x+6,ca.bottom-42);g.closePath();g.fill();
        g.strokeStyle='#fff';g.lineWidth=1.2;g.stroke();
        g.font='bold 10px -apple-system,Malgun Gothic,sans-serif';g.textAlign='center';
        const tx='3형제 매수',w=g.measureText(tx).width+8;g.fillStyle='rgba(255,255,255,.88)';g.fillRect(x-w/2,ca.bottom-56,w,13);
        g.fillStyle='#e8590c';g.fillText(tx,x,ca.bottom-46);g.restore();});
    }
    if(tf==='5m'&&sp5){
      const COL={'막내':'#e8590c','둘째':'#0b1220','큰형':'#7048e8'};
      sp5.forEach(m=>{if(m.i<a||m.i>b)return;const x=X(m.i);
        g.save();g.fillStyle=COL[m.nm];
        g.beginPath();g.moveTo(x,ca.bottom-6);g.lineTo(x-5,ca.bottom-16);g.lineTo(x+5,ca.bottom-16);
        g.closePath();g.fill();
        g.font='10px -apple-system,Malgun Gothic,sans-serif';g.textAlign='center';
        g.fillText(m.nm[0],x,ca.bottom-19);g.restore();});
    }
  }};
  if(SCH[cid])SCH[cid].destroy();
  SCH[cid]=new Chart(document.getElementById(cid),{type:'line',data:{labels,datasets:ds},plugins:[plug],
    options:{responsive:true,maintainAspectRatio:false,animation:false,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>{const nm=NM[c.datasetIndex];if(!nm)return null;
        const y=c.parsed.y;return nm+' '+(y==null?'-':(c.dataset.yAxisID==='y2'?S10(y):Math.round(y*10)/10));}}}},
      scales:{x:{ticks:{color:'#6b7280',maxTicksLimit:7,font:{size:9}},grid:{display:false}},
        y:{position:'left',ticks:{color:'#6b7280',font:{size:9}},grid:{color:'#eceef1'}},
        y2:{position:'right',min:0,max:100,ticks:{color:'#6b7280',stepSize:20,font:{size:9},callback:v=>v/10},grid:{display:false}}}}});
  return {span,a,b};
}

  const leg=WTFS.map(tf=>`<span><i style="background:${WCOL[tf]};height:3px"></i>막내${LBL[tf]}봉</span>`).join('');
  el.innerHTML=`<div class="bar"><span class="sub">표시</span>${togb}<span style="width:14px"></span><span class="sub">구간 폭</span>${spanb}</div>`
    +`<div class="wbox"><canvas id="cvW"></canvas></div>`
    +`<div class="info"><span id="wd0">-</span><span id="wmid">-</span><span id="wd1">-</span></div>`
    +`<div class="lg"><span><i style="background:#0ca678;height:4px"></i>가격</span>${leg}<span>차트 위에서 <b>휠</b> = 구간 넓게·좁게 · <b>Shift+휠</b> = 좌우 이동 · 끌기 = 이동</span></div>`
    +`<p class="note">각 선은 그 시간축 <b>막내(5·3·3) %K</b> 하나입니다. 화면은 0~10.`
    +` 가로축은 켜져 있는 선 중 가장 잘은 봉을 따르고, 굵은 봉의 값은 <b>그 봉 시각부터 다음 봉까지 같은 값으로 이어</b> 그립니다.`
    +` 5분봉 원본은 60거래일이라 더 긴 구간을 보려면 막내5분봉을 끄십시오(60분 축 3년). 붉은 점선 ${S10(CUT)} · 푸른 점선 ${S10(100-CUT)}.</p>`;
  el.querySelectorAll('[data-wt]').forEach(b=>b.onclick=()=>{WSHOW[b.dataset.wt]=!WSHOW[b.dataset.wt];WPOS=1e9;renderW();});
  el.querySelectorAll('[data-ws]').forEach(b=>b.onclick=()=>{
    const N=WROWS.find(r=>r.tf===wBase()).ts.length,cur=(WSPAN<=0||WSPAN>=N)?N:WSPAN,ctr=WPOS+cur/2;
    WSPAN=+b.dataset.ws;const ns=(WSPAN<=0||WSPAN>=N)?N:WSPAN;
    WPOS=Math.max(0,Math.min(N-ns,Math.round(ctr-ns/2)));renderW();});
  const box=el.querySelector('.wbox');
  let dg=false,sx=0,sp=0;
  box.addEventListener('pointerdown',e=>{dg=true;sx=e.clientX;sp=WPOS;box.classList.add('drag');try{box.setPointerCapture(e.pointerId);}catch(_){}});
  box.addEventListener('pointermove',e=>{if(!dg)return;
    const N=WROWS.find(r=>r.tf===wBase()).ts.length,cur=(WSPAN<=0||WSPAN>=N)?N:WSPAN;
    WPOS=Math.max(0,Math.min(N-cur,sp-Math.round((e.clientX-sx)/(box.clientWidth||800)*cur)));drawW();});
  const up=()=>{dg=false;box.classList.remove('drag');};
  box.addEventListener('pointerup',up);box.addEventListener('pointercancel',up);
  box.addEventListener('wheel',ev=>{ev.preventDefault();
    const N=WROWS.find(r=>r.tf===wBase()).ts.length,cur=(WSPAN<=0||WSPAN>=N)?N:WSPAN;
    const rect=box.getBoundingClientRect(),frac=Math.min(1,Math.max(0,(ev.clientX-rect.left)/rect.width));
    if(ev.shiftKey){WPOS=Math.max(0,Math.min(N-cur,WPOS+Math.sign(ev.deltaY)*Math.max(1,Math.round(cur*0.12))));drawW();return;}
    let ns=Math.round(ev.deltaY>0?cur*1.25:cur*0.8);ns=Math.max(20,Math.min(ns,N));
    const anchor=WPOS+cur*frac;WSPAN=(ns>=N)?0:ns;
    WPOS=Math.max(0,Math.min(N-ns,Math.round(anchor-ns*frac)));drawW();},{passive:false});
  drawW();}
function drawW(){
  const WBASE=wBase(),base=WROWS.find(r=>r.tf===WBASE);if(!base)return;
  const N=base.ts.length,span=(WSPAN<=0||WSPAN>=N)?N:WSPAN;
  WPOS=Math.max(0,Math.min(WPOS,N-span));
  const a=WPOS,b=a+span-1;
  const labels=[],px=[];for(let i=a;i<=b;i++){labels.push(fmtT(base.ts[i]));px.push(base.c[i]);}
  const line=(d,col,w,ax,o,dash)=>({data:d,borderColor:col,borderWidth:w,borderDash:dash||[],pointRadius:0,tension:.2,yAxisID:ax,order:o,spanGaps:false});
  const ds=[line(px,'rgba(255,255,255,.95)',7,'y',2),line(px,'#0ca678',3.4,'y',1)],NM=[null,'가격'];
  const show=WTFS.filter(tf=>WSHOW[tf]&&WMIN[tf]>=WMIN[WBASE]&&WROWS.some(r=>r.tf===tf));
  for(const tf of show){const r=WROWS.find(x=>x.tf===tf);
    const d=(tf===WBASE)?r.w.slice(a,b+1):base.ts.slice(a,b+1).map(t=>wAt(r.ts,r.w,t));
    ds.push(line(d,WCOL[tf],1.5,'y2',3));NM.push(LBL[tf]);}
  ds.push({data:labels.map(()=>CUT),borderColor:'rgba(217,45,32,.5)',borderWidth:1,borderDash:[5,4],pointRadius:0,yAxisID:'y2',order:4});
  ds.push({data:labels.map(()=>100-CUT),borderColor:'rgba(24,73,169,.5)',borderWidth:1,borderDash:[5,4],pointRadius:0,yAxisID:'y2',order:4});
  document.getElementById('wd0').textContent=fmtT(base.ts[a]);document.getElementById('wd1').textContent=fmtT(base.ts[b]);
  document.getElementById('wmid').textContent=`가로축 ${LBL[WBASE]} · 폭 ${span}봉 / 전체 ${N}봉 · 선 ${show.length}개`;
  const plug={id:'wave',beforeDatasetsDraw(ch){const ca=ch.chartArea;if(!ca)return;const g=ch.ctx;
    const items=show.map(tf=>{const r=WROWS.find(x=>x.tf===tf);const v=(tf===WBASE)?r.w[b]:wAt(r.ts,r.w,base.ts[b]);return ['막내'+LBL[tf]+' '+S10(v),WCOL[tf]];});
    g.save();g.font='bold 12px -apple-system,Malgun Gothic,sans-serif';g.textAlign='left';
    const w=items.reduce((s2,it)=>s2+g.measureText(it[0]).width+16,0)+6;
    g.fillStyle='rgba(255,255,255,.88)';g.fillRect(ca.left+2,ca.top+2,w,18);
    let x=ca.left+6;items.forEach(it=>{g.fillStyle=it[1];g.fillText(it[0],x,ca.top+14);x+=g.measureText(it[0]).width+16;});g.restore();}};
  if(WCH)WCH.destroy();
  WCH=new Chart(document.getElementById('cvW'),{type:'line',data:{labels,datasets:ds},plugins:[plug],
    options:{responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>{const nm=NM[c.datasetIndex];if(!nm)return null;
        const y=c.parsed.y;return nm+' '+(y==null?'-':(c.dataset.yAxisID==='y2'?S10(y):Math.round(y*10)/10));}}}},
      scales:{x:{ticks:{color:'#6b7280',maxTicksLimit:9,font:{size:10}},grid:{display:false}},
        y:{position:'left',ticks:{color:'#6b7280',font:{size:10}},grid:{color:'#eceef1'}},
        y2:{position:'right',min:0,max:100,ticks:{color:'#6b7280',stepSize:20,font:{size:10},callback:v=>v/10},grid:{display:false}}}}});}

// ───────── 실시간 공급기 스위치 ─────────
// 브라우저는 PC의 프로그램을 직접 켜지 못한다. 그래서 PC에 한 번 등록해 둔
// 「stochlive://」 프로토콜을 부른다 — 윈도가 그 등록을 보고 공급기를 창 없이 띄운다.
// 끄기는 공급기의 /stop 을 부르면 된다.
function liveBadge(){
  const el=document.getElementById('livebadge'); if(!el)return;
  const btn='padding:2px 8px;font-size:12px;margin-left:6px';
  if(LIVE.on){
    const old=(LIVE.ver||0)<LIVE_VER_NEED
      ?` <b style="color:#b42318">공급기 구버전(v${LIVE.ver||1}) — 파일을 덮어쓰고 [끄기]→[켜기]</b>`:'';
    el.innerHTML=`<b style="color:#2e7d32">● 실시간 ON</b>`
      +` <span class="sub">오늘 ${LIVE.last||'-'} 봉까지</span>${old}`
      +`<button id="liveoff" style="${btn}">끄기</button>`;
    document.getElementById('liveoff').onclick=async()=>{
      try{await fetch(LIVE_URL+'/stop',{signal:AbortSignal.timeout(2000)});}catch(e){}
      await new Promise(r=>setTimeout(r,900)); go();};
  }else{
    el.innerHTML=`<b style="color:#9aa0a6">○ 실시간 OFF</b>`
      +` <span class="sub">전일 수집분</span>`
      +`<button id="liveon" style="${btn}">공급기 켜기</button>`;
    const b=document.getElementById('liveon');
    b.onclick=async()=>{
      b.disabled=true; b.textContent='켜는 중…';
      location.href='stochlive://start';
      for(let i=0;i<12;i++){
        await new Promise(r=>setTimeout(r,1200));
        try{const r=await fetch(LIVE_URL+'/ping',{signal:AbortSignal.timeout(1500)});
            if(r.ok){go();return;}}catch(e){}
      }
      b.disabled=false; b.textContent='공급기 켜기';
      alert('공급기가 응답하지 않습니다.\n이 PC에서 처음이라면 _주식실시간 폴더의 «자동시작_설치.bat»을 한 번만 실행해 주십시오.');
    };
  }
}

async function go(){
  document.getElementById('vd').innerHTML='<p class="sub">불러오는 중…</p>';
  VROWS=null;
  try{
    DATA=await loadOne(CODE);POS=1e9;
    const hasMin=DATA.rows.some(r=>MIN.includes(r.tf));
    if(!hasMin){TF='D';
      document.getElementById('nomin').innerHTML=
        '<span class="tag">분봉 없음 — 관심 20종목만 분봉을 모읍니다. 이 종목은 일·주·월봉만 나옵니다.</span>';}
    else{document.getElementById('nomin').innerHTML='';
      if(!DATA.rows.some(r=>r.tf===TF))TF='60m';}
    render(); liveBadge();
    SROWS=null; WROWS=null; WPOS=1e9;
    if(TAB==='W')renderW();
    if(TAB==='V')renderV();
    if(TAB==='S')renderS();
  }catch(e){document.getElementById('vd').innerHTML='<div class="err">오류: '+e.message+'</div>';}
}
(async function(){
  let ALL=[];
  try{const idx=await fetch('../stoch/data/index.json').then(r=>r.json());
    ALL=(idx.tickers||[]).filter(t=>t.market!=='INDEX');
    ALL.forEach(t=>NAMES[t.code]=t.name);}catch(e){}
  try{WL=await fetch('../stoch/watchlist.json').then(r=>r.json());}catch(e){WL=[];}
  const sel=document.getElementById('sel');
  sel.innerHTML='<option value="">관심 20종목</option>'
    +WL.map(c=>`<option value="${c}">${NAMES[c]||c} (${c})</option>`).join('');
  document.getElementById('tk').innerHTML=
    ALL.map(t=>`<option value="${t.name} (${t.code})">`).join('');
  const qs=new URLSearchParams(location.search).get('code');
  CODE=(qs&&/^\d{6}$/.test(qs))?qs:(WL[0]||'005930');
  const qi=document.getElementById('q');
  const setCode=c=>{if(!c||c===CODE)return;CODE=c;qi.value=(NAMES[c]||'')+' ('+c+')';
    sel.value=WL.includes(c)?c:'';history.replaceState(null,'','?code='+c);go();};
  qi.value=(NAMES[CODE]||'')+' ('+CODE+')';
  sel.value=WL.includes(CODE)?CODE:'';
  const pick=()=>{const v=qi.value.trim();if(!v)return;
    let m=v.match(/(\d{6})/);
    if(!m){const hit=ALL.find(t=>t.name===v)||ALL.find(t=>t.name.startsWith(v))
             ||ALL.find(t=>t.name.indexOf(v)>=0);
      if(hit)m=[0,hit.code];}
    if(m)setCode(m[1]);};
  qi.onchange=pick;
  qi.onkeydown=e=>{if(e.key==='Enter')pick();};
  sel.onchange=()=>{if(sel.value)setCode(sel.value);};
  document.getElementById('tabS').onclick=()=>showTab('S');
  document.getElementById('tabT').onclick=()=>showTab('T');
  document.getElementById('tabV').onclick=()=>showTab('V');
  document.getElementById('tabW').onclick=()=>showTab('W');
  document.getElementById('cut').onchange=e=>{CUT=+e.target.value;render();if(TAB==='W')drawW();};
  document.getElementById('tr').onchange=e=>{TRN=+e.target.value;render();};
  document.getElementById('sc').oninput=e=>{POS=+e.target.value;render();};
  document.getElementById('prev').onclick=()=>{POS=Math.max(0,POS-Math.round(SPAN/3||20));render();};
  document.getElementById('next').onclick=()=>{POS=POS+Math.round(SPAN/3||20);render();};
  go();
})();
</script>
